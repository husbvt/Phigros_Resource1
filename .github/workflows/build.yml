name: Phigros Auto Extraction (Full)

on:
  workflow_dispatch: # 手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 全量提取时间较长，建议给足 2 小时

    steps:
      - name: Checkout Script Repo
        uses: actions/checkout@v4
        with:
          path: resource

      - name: Download & Extract APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          # 这里假设你已经有了下载 APK 的逻辑，并将文件命名为 Phigros.apk 放入 resource 目录
          # ... (保持之前的下载逻辑) ...

      - name: Setup Info
        run: |
          # 脚本提取头像需要 info/tmp.tsv
          # 请确保你的仓库中有这个文件或从 7aGiven 检出
          mkdir -p resource/info
          # cp ... 

      - name: Setup Python & Deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          # 提取音乐需要系统级的 vorbis 库和 Python 的 fsb5
          sudo apt-get install -y libogg-dev libvorbis-dev
          pip install UnityPy==1.10.18 fsb5

      - name: Execution with Auto-Config
        working-directory: ./resource
        run: |
          # --- 自动化策略 1：降低并发防止卡死 ---
          # 将源码中的 ThreadPoolExecutor(6) 改为 (1)，确保在 7GB 内存下稳定运行
          sed -i 's/ThreadPoolExecutor(6)/ThreadPoolExecutor(1)/g' resource.py

          # --- 自动化策略 2：按需自动修改 config.ini ---
          # 编写一个小函数来切换配置并运行
          run_task() {
            TASK_NAME=$1
            echo "🚀 正在自动化提取: $TASK_NAME"
            
            # 关闭所有开关
            sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
            
            # 开启当前任务开关
            # 注意：resource.py 中谱面开关名为 'Chart'，变量名为 'chart'
            if [ "$TASK_NAME" == "Chart" ]; then
              sed -i -E "s/^Chart[[:space:]]*=.*/Chart = True/I" config.ini
            else
              sed -i -E "s/^$TASK_NAME[[:space:]]*=.*/$TASK_NAME = True/I" config.ini
            fi

            # 执行脚本，对每一项设置超时保护
            timeout 1800 python resource.py Phigros.apk || echo "⚠️ $TASK_NAME 提取超时或失败，继续下一项"
          }

          # 自动化执行队列
          run_task "avatar"       # 提取头像
          run_task "Chart"        # 提取谱面
          run_task "music"        # 提取音乐
          run_task "illustration" # 提取曲绘原画

      - name: Checkout Build Repo & Push
        run: |
          # ... (执行你的推送逻辑，将产生的 avatar/ chart/ music/ illustration/ 文件夹同步) ...
