name: Build Phigros Resources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 创建历史目录
      - name: Create History Directory
        run: mkdir -p history

      # 2. 下载Release中的全部分卷文件
      - name: Download ALL Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 验证下载的分卷文件
      - name: Check Downloaded Archives
        working-directory: ./history
        run: |
          echo "=== 已下载的分卷文件 ==="
          ls -la *.7z.* 2>/dev/null | sort -V || echo "未找到分卷文件"
          VOLUME_COUNT=$(ls *.7z.* 2>/dev/null | wc -l)
          echo "✅ 找到 $VOLUME_COUNT 个分卷文件"

      # 4. 安装解压工具
      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      # 5. 解压分卷包
      - name: Extract & Prepare APK
        working-directory: ./history
        run: |
          FIRST_VOLUME=$(ls *.7z.001 2>/dev/null | head -n 1)
          if [ -z "$FIRST_VOLUME" ]; then
            echo "❌ 错误：找不到.7z.001文件"
            exit 1
          fi
          7z x "$FIRST_VOLUME" -y

      # 6. 查找并准备APK文件
      - name: Find and Prepare APK
        working-directory: ./history
        run: |
          APK=$(find . -type f \( -name "*.apk" -o -name "*.xapk" \) | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ 未找到APK文件"
            exit 1
          fi
          cp "$APK" Phigros.apk
          echo "✅ APK文件已准备"

      # 7. 检出资源处理脚本仓库
      - name: Checkout Phigros_Resource1
        uses: actions/checkout@v4
        with:
          path: resource

      # 8. 更新APK到资源目录
      - name: Update APK
        run: cp history/Phigros.apk resource/Phigros.apk

      # 9. 设置Python环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 10. 安装Python依赖（如果有）
      - name: Install Python dependencies
        working-directory: ./resource
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      # 11. 清理旧的输出文件
      - name: Clean old outputs
        working-directory: resource
        run: |
          rm -rf avatar chart illustration illustrationBlur illustrationLowRes music

      # 12. 运行资源提取脚本
      - name: Run resources.py
        working-directory: resource
        run: |
          echo "正在运行资源提取脚本..."
          python resources.py
          echo "✅ 资源提取完成"

      # 13. 调试：检查生成的资源
      - name: Check Generated Resources
        working-directory: ./resource
        run: |
          echo "=== 生成的资源文件 ==="
          du -sh avatar/ chart/ illustration/ music/ 2>/dev/null || echo "部分目录不存在"
          echo "=== 各目录文件数 ==="
          for dir in avatar chart illustration illustrationBlur illustrationLowRes music; do
            if [ -d "$dir" ]; then
              count=$(find "$dir" -type f | wc -l)
              echo "$dir: $count 个文件"
            fi
          done

      # 14. 检出构建产物仓库
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          ref: master
          path: build

      # 15. 发布资源到构建仓库
      - name: Publish resources
        working-directory: ./resource
        run: |
          rsync -av --delete \
            avatar \
            chart \
            illustration \
            illustrationBlur \
            illustrationLowRes \
            music \
            ../build/

      # 16. 提交并推送更改
      - name: Commit & Push
        working-directory: ./build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "没有更改，跳过提交"
          else
            git commit -m "自动更新资源 $(date +'%Y-%m-%d %H:%M')"
            git push origin master
          fi
