name: Phigros Sync to Dedicated Page

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 1. 检出脚本仓库
        uses: actions/checkout@v4
        with:
          path: resource

      - name: 2. 下载并解压 APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full rsync libogg-dev libvorbis-dev
          pip install UnityPy==1.10.18 fsb5
          # 请确保此处 Phigros.apk 已下载到 ./resource/ 目录下

      - name: 3. 检出资源库 (husbvt/Phigros_Resource_Build)
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 4. 自动化分阶段提取 (修复 Config 报错)
        working-directory: ./resource
        run: |
          sed -i 's/ThreadPoolExecutor(6)/ThreadPoolExecutor(1)/g' resource.py
          
          run_extract() {
            cat > config.ini <<EOF
          [TYPES]
          avatar = $([[ "$1" == "avatar" ]] && echo "True" || echo "False")
          Chart = $([[ "$1" == "chart" ]] && echo "True" || echo "False")
          music = $([[ "$1" == "music" ]] && echo "True" || echo "False")
          illustration = $([[ "$1" == "illustration" ]] && echo "True" || echo "False")
          illustrationBlur = False
          illustrationLowRes = False
          EOF
            python resource.py Phigros.apk || echo "Skip $1"
          }

          for task in avatar chart music illustration; do
            run_extract "$task"
            # 兼容处理提取后的文件夹名
            for d in $task ${task^}; do
              if [ -d "$d" ]; then
                rsync -av "$d/" "../build_repo/$task/"
                rm -rf "$d"/*
              fi
            done
          done

      - name: 5. 生成索引网页 (index.html)
        working-directory: ./build_repo
        run: |
          # 资源重定向地址：指向 2.1GB 资源所在的 Pages 服务
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Phigros Download Center</title>
              <style>
                  body { font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
                  .container { max-width: 900px; margin: auto; }
                  h1 { color: #58a6ff; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
                  input#search { width: 100%; padding: 12px; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 8px; margin: 20px 0; box-sizing: border-box; }
                  .item { background: #161b22; border: 1px solid #30363d; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
                  .tag { font-size: 10px; padding: 3px 8px; border-radius: 12px; background: #238636; color: white; margin-right: 12px; }
                  .btn { color: #58a6ff; text-decoration: none; font-weight: bold; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; }
                  .btn:hover { background: #30363d; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Phigros 资源库 (专用下载站)</h1>
                  <input type="text" id="search" placeholder="搜索歌曲、谱面或曲绘..." onkeyup="search()">
                  <div id="list">
          EOF

          # 自动生成超链接（指向资源库仓库的 Pages 路径）
          find music chart illustration avatar -type f | sort | while read -r f; do
             T=$(echo "$f" | cut -d'/' -f1 | tr 'a-z' 'A-Z')
             echo "<div class='item'><div><span class='tag'>$T</span>$(basename "$f")</div><a class='btn' href='$BASE_URL/$f' target='_blank'>下载</a></div>" >> index.html
          done

          cat >> index.html <<EOF
                  </div>
              </div>
              <script>
                  function search() {
                      let q = document.getElementById('search').value.toLowerCase();
                      document.querySelectorAll('.item').forEach(i => {
                          i.style.display = i.innerText.toLowerCase().includes(q) ? "" : "none";
                      });
                  }
              </script>
          </body>
          </html>
          EOF

      - name: 6. 推送 2.1GB 资源到 Phigros_Resource_Build
        working-directory: ./build_repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add music/ chart/ illustration/ avatar/
          git commit -m "Update Assets" || echo "No changes"
          git push "https://${{ secrets.BUILD_PAT }}@github.com/husbvt/Phigros_Resource_Build.git" HEAD:master --force

      - name: 7. 部署 index.html 到 phigros.github.io
        run: |
          git clone --depth 1 "https://${{ secrets.BUILD_PAT }}@github.com/husbvt/phigros.github.io.git" pages_repo
          cp build_repo/index.html pages_repo/
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Download Station UI" || echo "No changes"
          git push origin master --force
