name: Build Phigros Resources (Final Corrected)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 检出脚本仓库
      - name: Checkout Script Repo
        uses: actions/checkout@v4
        with:
          path: resource

      # 2. 下载历史分卷包 (独立步骤)
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安装工具并解压 APK
      - name: Extract & Prepare APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          shopt -s nullglob
          cd history
          7z x "*.7z.001" -y
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then 
            echo "❌ 未找到 APK"
            exit 1
          fi
          mv "$APK_FILE" ../resource/Phigros.apk
          echo "✅ APK 已就绪"

      # 4. 获取描述信息 (info)
      - name: Checkout Info Directory
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_source

      - name: Setup Info
        run: |
          mkdir -p resource/info
          cp -rn info_source/* resource/info/ 2>/dev/null || true

      # 5. 设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 6. 安装依赖
      - name: Install Dependencies
        run: |
          sudo apt-get install -y libogg-dev libvorbis-dev
          pip install UnityPy fsb5

      # 7. 分进程批处理 (修复缩进与逻辑)
      - name: Process Isolated Extraction
        working-directory: ./resource
        run: |
          # 辅助函数：重置所有开关为 False
          reset_config() {
            sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          }

          # A. 处理轻量资源
          echo "🚀 批次 1: 头像与谱面"
          reset_config
          sed -i -E "s/^avatar[[:space:]]*=.*/avatar = True/I" config.ini
          sed -i -E "s/^Chart[[:space:]]*=.*/Chart = True/I" config.ini
          python resource.py Phigros.apk || echo "Avatar/Chart 提取异常"

          # B. 处理音频
          echo "🚀 批次 2: 音乐"
          reset_config
          sed -i -E "s/^music[[:space:]]*=.*/music = True/I" config.ini
          timeout 600 python resource.py Phigros.apk || echo "音乐提取超时"

          # C. 处理插图原画 (最易卡死项)
          echo "🚀 批次 3: 插图"
          reset_config
          sed -i -E "s/^illustration[[:space:]]*=.*/illustration = True/I" config.ini
          # 给插图设置 15 分钟严格超时，防止卡死整个 Workflow
          timeout 900 python resource.py Phigros.apk || echo "⚠️ 插图提取部分超时跳过"

      # 8. 检出目标仓库
      - name: Checkout Build Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      # 9. 同步与推送
      - name: Sync & Push
        working-directory: ./resource
        run: |
          for folder in avatar chart illustration music; do
            if [ -d "$folder" ] && [ "$(ls -A $folder)" ]; then
              mkdir -p ../build_repo/$folder
              rsync -av --delete "$folder/" "../build_repo/$folder/"
            fi
          done
          
          cd ../build_repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto Update (Isolated Batch)"
            git push origin master
          else
            echo "无资源变动"
          fi
