name: Phigros Full Resources Final with Pages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 1. 检出脚本仓库
        uses: actions/checkout@v4
        with:
          path: resource

      - name: 2. 下载 APK 分卷包
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./downloads"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. 解压并定位 APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full rsync
          mkdir -p ./extracted
          7z x "downloads/*.7z.001" -o./extracted -y || echo "7z Skip"
          FOUND_APK=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$FOUND_APK" ]; then echo "❌ APK NOT FOUND"; exit 1; fi
          mkdir -p ./resource
          cp "$FOUND_APK" ./resource/Phigros.apk

      - name: 4. 环境与依赖
        run: |
          sudo apt-get install -y libogg-dev libvorbis-dev
          pip install UnityPy==1.10.18 fsb5

      - name: 5. 检出目标仓库 (husbvt)
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 6. 自动化分阶段提取
        working-directory: ./resource
        run: |
          sed -i 's/ThreadPoolExecutor(6)/ThreadPoolExecutor(1)/g' resource.py

          # --- 1. 提取头像 (Avatar) ---
          echo "🚀 Processing: avatar"
          sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          sed -i -E "s/^avatar[[:space:]]*=.*/avatar = True/I" config.ini
          python resource.py Phigros.apk || echo "Skip"
          for d in avatar Avatar; do
            if [ -d "$d" ] && [ "$(ls -A "$d" 2>/dev/null)" ]; then
              rsync -av "$d/" "../build_repo/avatar/"
              rm -rf "$d"/*
            fi
          done

          # --- 2. 提取谱面 (Chart) ---
          echo "🚀 Processing: Chart"
          sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          sed -i -E "s/^Chart[[:space:]]*=.*/Chart = True/I" config.ini
          python resource.py Phigros.apk || echo "Skip"
          if [ -d "chart" ]; then rsync -av "chart/" "../build_repo/chart/"; rm -rf "chart"/*; fi

          # --- 3. 提取音乐 (music) ---
          echo "🚀 Processing: music"
          sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          sed -i -E "s/^music[[:space:]]*=.*/music = True/I" config.ini
          python resource.py Phigros.apk || echo "Skip"
          if [ -d "music" ]; then rsync -av "music/" "../build_repo/music/"; rm -rf "music"/*; fi

          # --- 4. 提取曲绘 (illustration) ---
          echo "🚀 Processing: illustration"
          sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          sed -i -E "s/^illustration[[:space:]]*=.*/illustration = True/I" config.ini
          python resource.py Phigros.apk || echo "Skip"
          if [ -d "illustration" ]; then rsync -av "illustration/" "../build_repo/illustration/"; rm -rf "illustration"/*; fi

      - name: 7. 推送资源至 husbvt 仓库
        working-directory: ./build_repo
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto Update Resources: $(date +'%Y-%m-%d %H:%M')"
            git push "https://${AUTH_TOKEN}@github.com/husbvt/Phigros_Resource_Build.git" HEAD:master --force
          else
            echo "✅ No changes to push."
          fi

      - name: 8. 生成下载页并推送至 phigros.github.io
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          # 1. 克隆网页仓库
          git clone "https://${AUTH_TOKEN}@github.com/husbvt/phigros.github.io.git" pages_repo
          
          # 2. 在 pages_repo 中生成 index.html
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          cat > pages_repo/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Phigros 资源下载站</title>
              <style>
                  body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
                  .item { background: #1e1e1e; padding: 10px; margin: 5px; border-radius: 5px; display: flex; justify-content: space-between; }
                  input { width: 100%; padding: 10px; margin-bottom: 20px; background: #333; color: #fff; border: none; }
                  a { color: #4db8ff; text-decoration: none; border: 1px solid #4db8ff; padding: 2px 8px; border-radius: 4px; }
              </style>
          </head>
          <body>
              <h1>Phigros 资源库</h1>
              <input type="text" id="s" placeholder="搜索..." onkeyup="search()">
              <div id="l">
          EOF

          # 扫描 build_repo 里的文件生成列表
          cd build_repo
          find music chart illustration avatar -type f | sort | while read -r f; do
            echo "<div class='item'><span>$f</span><a href='$BASE_URL/$f' target='_blank'>下载</a></div>" >> ../pages_repo/index.html
          done
          cd ..

          cat >> pages_repo/index.html <<EOF
              </div>
              <script>
                  function search() {
                      let q = document.getElementById('s').value.toLowerCase();
                      document.querySelectorAll('.item').forEach(i => {
                          i.style.display = i.innerText.toLowerCase().includes(q) ? "" : "none";
                      });
                  }
              </script>
          </body>
          </html>
          EOF

          # 3. 推送网页
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Navigation Page" || echo "No changes"
          git push
