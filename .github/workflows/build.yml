name: Phigros Batch Extraction Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: 1. 检出脚本仓库
        uses: actions/checkout@v4
        with:
          path: resource

      - name: 2. 下载并强制定位 APK
        # 这一步整合了下载、解压和路径纠正
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full rsync
          
          # --- 这里请确保你的下载逻辑正常运行 ---
          # 假设你是从 Release 下载的 7z 分卷包
          uses: robinraju/release-downloader@v1.10
          with:
            repository: "SteveZMTstudios/Phigros-history"
            latest: true
            fileName: "*.7z.*"
            out-file-path: "./downloads"
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # 解压文件
          7z x "downloads/*.7z.001" -o./extracted -y || echo "7z 解压跳过或失败"
          
          # 【核心修复】全盘搜索 APK 并强制移动到脚本目录
          echo "🔎 正在定位 APK 文件..."
          FOUND_APK=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "❌ 错误：工作区内找不到任何 .apk 文件！"
            exit 1
          fi
          echo "✅ 找到 APK: $FOUND_APK"
          # 确保文件被移动到 resource 目录下，并统一命名为 Phigros.apk
          cp "$FOUND_APK" ./resource/Phigros.apk
          ls -lh ./resource/Phigros.apk

      - name: 3. 环境与依赖安装
        run: |
          sudo apt-get install -y libogg-dev libvorbis-dev
          pip install UnityPy==1.10.18 fsb5

      - name: 4. 检出目标仓库 (husbvt)
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 5. 自动化分批提取
        working-directory: ./resource
        run: |
          # 再次确认文件存在，双重保险
          if [ ! -f "Phigros.apk" ]; then echo "❌ APK 丢失！"; exit 1; fi
          
          # 强制将源码并发改为 1，防止 7GB 内存溢出导致提取到一半卡死
          sed -i 's/ThreadPoolExecutor(6)/ThreadPoolExecutor(1)/g' resource.py

          run_batch() {
            local task=$1
            echo "------------------------------------------"
            echo "🚀 执行任务: $task"
            # 自动化修改 config.ini 里的开关
            sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
            if [ "$task" == "Chart" ]; then
              sed -i -E "s/^Chart[[:space:]]*=.*/Chart = True/I" config.ini
            else
              sed -i -E "s/^$task[[:space:]]*=.*/$task = True/I" config.ini
            fi
            # 运行提取
            python resource.py Phigros.apk || echo "⚠️
            
