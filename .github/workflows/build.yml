name: Build Phigros Resources (修改配置分批)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 创建历史目录
      - name: Create History Directory
        run: mkdir -p history

      # 2. 从Release下载全部分卷文件
      - name: Download ALL Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安装解压工具
      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      # 4. 解压分卷包并提取APK
      - name: Extract & Prepare APK
        working-directory: ./history
        run: |
          shopt -s nullglob
          for f in *.7z.001; do 7z x "$f"; done
          APK=$(find . -name "*.apk" | head -n 1)
          cp "$APK" Phigros.apk
          rm -f *.7z.*

      # 5. 检出资源处理脚本仓库
      - name: Checkout Phigros_Resource1
        uses: actions/checkout@v4
        with:
          path: resource

      # 6. 【关键修正】获取并设置 info 目录
      - name: Checkout Info Directory
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_source

      - name: Setup Info Directory
        working-directory: ./resource
        run: |
          echo "=== 设置 info 目录 ==="
          # 确保目标目录存在
          mkdir -p info
          
          echo "1. 源目录 (info_source) 内容:"
          ls -la ../info_source/
          
          echo "2. 正在复制所有文件到 resource/info ..."
          # 复制所有文件，-n 表示不覆盖已存在文件
          cp -rn ../info_source/* info/ 2>/dev/null || true
          
          echo "3. 目标目录 (resource/info) 内容:"
          ls -la info/
          
          echo "4. 关键文件检查:"
          REQUIRED_FILES=("tmp.tsv" "difficulty.tsv")
          ALL_FOUND=true
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "info/$file" ]; then
              echo "   ✅ 找到: info/$file"
            else
              echo "   ❌ 缺失: info/$file (脚本运行将失败)"
              ALL_FOUND=false
            fi
          done
          
          if [ "$ALL_FOUND" = false ]; then
            echo "错误：必需的文件缺失，请检查远程仓库结构。"
            exit 1
          fi

      # 7. 更新APK文件
      - name: Update APK
        run: cp history/Phigros.apk resource/Phigros.apk

      # 8. 设置Python环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 9. 安装Python依赖
      - name: Install Python dependencies
        working-directory: ./resource
        run: |
          echo "正在安装Python依赖包..."
          pip install UnityPy fsb5
          echo "依赖安装完成。"

      # 10. 清理旧的输出文件
      - name: Clean old outputs
        working-directory: resource
        run: |
          rm -rf avatar chart illustration illustrationBlur illustrationLowRes music

      # 11. 【核心】通过修改 config.ini 进行分批处理
      - name: Run resource.py by Type (Modify Config)
        working-directory: ./resource
        run: |
          echo "开始通过修改配置分批处理..."
          echo "总开始时间: $(date)"
          
          # 定义处理顺序（可根据需要调整）
          RESOURCE_TYPES=("avatar" "Chart" "illustrationBlur" "illustrationLowRes" "illustration" "music")
          
          # 记录原始配置内容，用于最后恢复
          ORIGINAL_CONFIG=$(cat config.ini)
          
          for CURRENT_TYPE in "${RESOURCE_TYPES[@]}"; do
            echo ""
            echo "======= 开始处理类型: $CURRENT_TYPE ======="
            echo "批次开始时间: $(date)"
            
            # 1. 修改 config.ini：将所有类型设为 False，然后将当前类型设为 True
            # 注意：脚本配置中 'Chart' 首字母大写，而其他为小写
            sed -i "s/^\(avatar\|Chart\|illustrationBlur\|illustrationLowRes\|illustration\|music\) = .*$/\1 = False/" config.ini
            sed -i "s/^$CURRENT_TYPE = .*$/$CURRENT_TYPE = True/" config.ini
            
            # 2. 显示修改后的配置（调试用）
            echo "修改后的 config.ini 相关部分:"
            grep -E "^(avatar|Chart|illustration|music)" config.ini
            echo "------------------------"
            
            # 3. 运行脚本（仅处理当前类型）
            echo "启动 resource.py..."
            python resource.py Phigros.apk 2>&1 | tail -30
            
            # 4. 批次结束后强制垃圾回收并稍作等待
            python3 -c "import gc; gc.collect()"
            sleep 2
            
            echo "======= 完成处理类型: $CURRENT_TYPE ======="
            echo "批次结束时间: $(date)"
          done
          
          # 所有批次完成后，恢复原始配置
          echo "$ORIGINAL_CONFIG" > config.ini
          echo "✅ 已恢复原始 config.ini 配置"
          
          echo ""
          echo "✅ 所有类型分批处理完成"
          echo "总结束时间: $(date)"

      # 12. 检查生成的资源
      - name: Check generated resources
        working-directory: ./resource
        run: |
          echo "=== 最终生成的资源统计 ==="
          for dir in avatar chart illustration illustrationBlur illustrationLowRes music; do
            if [ -d "$dir" ]; then
              COUNT=$(find "$dir" -type f 2>/dev/null | wc -l)
              SIZE=$(du -sh "$dir" 2>/dev/null | cut -f1)
              echo "$dir: $COUNT 个文件 ($SIZE)"
            fi
          done

      # 13. 检出构建产物仓库
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          ref: master
          path: build

      # 14. 发布资源到构建仓库
      - name: Publish resources
        working-directory: ./resource
        run: |
          rsync -av --delete \
            avatar chart illustration illustrationBlur illustrationLowRes music \
            ../build/

      # 15. 提交并推送更改
      - name: Commit & Push
        working-directory: ./build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "自动更新资源 (配置分批) - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin master
          fi
