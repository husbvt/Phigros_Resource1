name: Build Phigros Resources (修复版)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 创建历史目录
      - name: Create History Directory
        run: mkdir -p history

      # 2. 下载全部分卷文件
      - name: Download ALL Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安装系统工具
      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget

      # 4. 安装音频编解码器库
      - name: Install Audio Codec Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libogg-dev \
            libvorbis-dev \
            libvorbis0a \
            libvorbisenc2 \
            libvorbisfile3

      # 5. 解压并准备APK
      - name: Extract & Prepare APK
        working-directory: ./history
        run: |
          shopt -s nullglob
          for f in *.7z.001; do
            echo "解压: $f"
            7z x "$f" -y
          done
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found"
            exit 1
          fi
          cp "$APK" Phigros.apk
          rm -f *.7z.* 2>/dev/null || true

      # 6. 检出资源脚本仓库
      - name: Checkout Phigros_Resource1
        uses: actions/checkout@v4
        with:
          path: resource

      # 7. 获取 info 目录
      - name: Checkout Info Directory
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_source

      - name: Setup Info Directory
        working-directory: ./resource
        run: |
          mkdir -p info
          cp -rn ../info_source/* info/ 2>/dev/null || true
          [ -f "info/tmp.tsv" ] && echo "✅ tmp.tsv 存在" || echo "❌ tmp.tsv 缺失（将跳过avatar处理）"

      # 8. 更新APK
      - name: Update APK
        run: cp history/Phigros.apk resource/Phigros.apk

      # 9. 设置Python环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 10. 安装Python依赖
      - name: Install Python Dependencies
        working-directory: ./resource
        run: |
          pip uninstall -y fsb5 UnityPy 2>/dev/null || true
          pip install UnityPy
          pip install "git+https://github.com/HearthSim/python-fsb5.git"

      # 11. 清理旧输出
      - name: Clean Old Outputs
        working-directory: resource
        run: |
          rm -rf avatar chart illustration music

      # 12. 应用Chart修复补丁
      - name: Apply Chart Fix Patch
        working-directory: ./resource
        run: |
          echo "应用Chart修复补丁..."
          # 备份原文件
          cp resource.py resource.py.backup
          
          # 创建补丁脚本
          cat > fix_chart.py << 'EOF'
import re

with open('resource.py', 'r', encoding='utf-8') as f:
    content = f.read()

# 查找Chart处理代码的位置
# 先找到处理TextAsset的部分
chart_pattern = r'(\s*if obj\.type\.name == "TextAsset".*?Chart.*?:)'

def add_skip_logic(match):
    original_line = match.group(1)
    skip_code = '''
            # 跳过可能卡住的文件
            skip_files = ["TEmoji", "emoji", "Emoji", "Tutorial", "Debug", "Test"]
            if any(skip_file in obj.path for skip_file in skip_files):
                print(f"跳过可疑文件: {obj.path}")
                continue'''
    
    return original_line + skip_code

new_content = re.sub(chart_pattern, add_skip_logic, content, flags=re.DOTALL)

with open('resource.py', 'w', encoding='utf-8') as f:
    f.write(new_content)

print("✅ Chart修复补丁已应用")
print("将在处理Chart时跳过可疑文件")
EOF

          python3 fix_chart.py
          rm -f fix_chart.py

      # 13. 核心分批处理
      - name: Run Resource Extraction
        working-directory: ./resource
        run: |
          echo "开始核心资源分批处理..."
          
          # 核心处理类型
          CORE_TYPES=("illustration" "Chart" "music")
          [ -f "info/tmp.tsv" ] && CORE_TYPES=("avatar" "${CORE_TYPES[@]}")
          
          echo "将处理类型: ${CORE_TYPES[*]}"
          
          # 备份配置
          [ -f "config.ini" ] && cp config.ini config.ini.backup
          
          SUCCESS_TYPES=""
          FAILED_TYPES=""
          
          for CURRENT_TYPE in "${CORE_TYPES[@]}"; do
            echo ""
            echo "======= 处理类型: $CURRENT_TYPE ======="
            echo "开始时间: $(date)"
            
            # 跳过条件
            if [ "$CURRENT_TYPE" = "avatar" ] && [ ! -f "info/tmp.tsv" ]; then
              echo "⚠️ 跳过avatar（缺少tmp.tsv）"
              continue
            fi
            
            # 修改配置
            sed -i "s/^\(avatar\|Chart\|illustration\|music\) = .*$/\\1 = False/" config.ini 2>/dev/null
            sed -i "s/^$CURRENT_TYPE = .*$/$CURRENT_TYPE = True/" config.ini 2>/dev/null
            
            # 运行提取
            echo "启动提取进程..."
            
            if [ "$CURRENT_TYPE" = "Chart" ]; then
              echo "📊 Chart处理（已应用跳过补丁）"
              timeout 1800 python resource.py Phigros.apk 2>&1 | tail -100
            else
              timeout 900 python resource.py Phigros.apk 2>&1 | tail -50
            fi
            
            EXIT_CODE=${PIPESTATUS[0]}
            
            if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 137 ]; then
              echo "❌ $CURRENT_TYPE 超时"
              FAILED_TYPES="$FAILED_TYPES $CURRENT_TYPE"
            elif [ $EXIT_CODE -eq 0 ]; then
              echo "✅ $CURRENT_TYPE 成功"
              SUCCESS_TYPES="$SUCCESS_TYPES $CURRENT_TYPE"
              
              # 检查输出
              if [ -d "$CURRENT_TYPE" ]; then
                COUNT=$(find "$CURRENT_TYPE" -type f 2>/dev/null | wc -l)
                echo "📊 生成 $COUNT 个文件"
              fi
            else
              echo "❌ $CURRENT_TYPE 失败（代码:$EXIT_CODE）"
              FAILED_TYPES="$FAILED_TYPES $CURRENT_TYPE"
            fi
            
            # 清理内存
            python3 -c "import gc; gc.collect()"
            sleep 2
            
            echo "结束时间: $(date)"
          done
          
          # 恢复配置
          [ -f "config.ini.backup" ] && mv config.ini.backup config.ini
          
          # 恢复原版resource.py
          if [ -f "resource.py.backup" ]; then
            cp resource.py.backup resource.py
            echo "✅ 恢复原版resource.py"
          fi
          
          # 最终报告
          echo ""
          echo "======= 处理完成 ======="
          echo "✅ 成功: $SUCCESS_TYPES"
          [ -n "$FAILED_TYPES" ] && echo "❌ 失败: $FAILED_TYPES"
          echo "总结束时间: $(date)"
          
          # 如果Chart失败但其他成功，继续
          if [[ "$FAILED_TYPES" == *"Chart"* ]] && [[ "$SUCCESS_TYPES" == *"illustration"* ]]; then
            echo "⚠️  Chart处理失败，但其他成功，继续工作流"
          elif [ -z "$SUCCESS_TYPES" ]; then
            echo "❌ 所有类型都失败"
            exit 1
          fi

      # 14. 验证生成资源
      - name: Verify Generated Resources
        working-directory: ./resource
        run: |
          echo "=== 生成资源验证 ==="
          TOTAL_COUNT=0
          for dir in avatar chart illustration music; do
            if [ -d "$dir" ] && [ -n "$(ls -A $dir 2>/dev/null)" ]; then
              COUNT=$(find "$dir" -type f 2>/dev/null | wc -l)
              SIZE=$(du -sh "$dir" 2>/dev/null | cut -f1)
              echo "✅ $dir: $COUNT 文件 ($SIZE)"
              TOTAL_COUNT=$((TOTAL_COUNT + COUNT))
            else
              echo "➖ $dir: 未生成或为空"
            fi
          done
          echo "总计: $TOTAL_COUNT 个资源文件"

      # 15. 检出发布仓库
      - name: Checkout Build Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          ref: master
          path: build

      # 16. 发布资源
      - name: Publish Resources
        working-directory: ./resource
        run: |
          echo "正在发布资源..."
          for dir in avatar chart illustration music; do
            if [ -d "$dir" ] && [ -n "$(ls -A $dir 2>/dev/null)" ]; then
              echo "发布 $dir..."
              mkdir -p ../build/$dir
              rsync -av --delete "$dir/" "../build/$dir/"
            fi
          done
          echo "✅ 资源发布完成"

      # 17. 提交更改
      - name: Commit Changes
        working-directory: ./build
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动更新资源 [$(date +'%Y-%m-%d %H:%M')]"
            git push origin master
            echo "✅ 变更已提交"
          fi

      # 18. 最终状态报告
      - name: Final Status Report
        run: |
          echo "=== 工作流执行完成 ==="
          echo "完成时间: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "运行器: $(uname -a)"
          echo "磁盘状态:"
          df -h | grep -E "Filesystem|/dev/root"
