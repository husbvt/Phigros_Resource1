name: Build Phigros Resources (完整版)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 创建历史目录
      - name: Create History Directory
        run: mkdir -p history

      # 2. 从Release下载全部分卷文件
      - name: Download ALL Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安装解压工具
      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      # 4. 解压分卷包并提取APK
      - name: Extract & Prepare APK
        working-directory: ./history
        run: |
          shopt -s nullglob
          for f in *.7z.001; do 7z x "$f"; done
          APK=$(find . -name "*.apk" | head -n 1)
          cp "$APK" Phigros.apk
          rm -f *.7z.*

      # 5. 检出资源处理脚本仓库
      - name: Checkout Phigros_Resource1
        uses: actions/checkout@v4
        with:
          path: resource

      # 5.1 【新增】下载包含 info 目录的仓库分支
      - name: Checkout Info Directory
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_temp

      # 5.2 【新增】移动 Info 目录到 resource 下
      - name: Move Info Directory
        run: |
          echo "正在移动 info 目录..."
          # 检查下载的内容结构
          echo "info_temp 目录结构:"
          ls -la info_temp/
          # 假设info文件夹在根目录，将其移动到resource下
          mv info_temp/info resource/ 2>/dev/null || echo "尝试其他目录结构..."
          # 如果info文件夹不在根目录，尝试移动整个目录
          if [ ! -d "resource/info" ]; then
            echo "未找到info/子目录，尝试将整个内容作为info目录"
            mv info_temp resource/info
          fi
          rm -rf info_temp
          echo "移动完成，检查 resource/info:"
          ls -la resource/info/ 2>/dev/null || echo "警告：resource/info 可能不存在"

      # 6. 更新APK文件
      - name: Update APK
        run: cp history/Phigros.apk resource/Phigros.apk

      # 7. 设置Python环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 8. 安装Python依赖
      - name: Install Python dependencies
        working-directory: ./resource
        run: |
          echo "正在安装Python依赖包..."
          pip install UnityPy fsb5
          echo "依赖安装完成。"

      # 9. 清理旧的输出文件
      - name: Clean old outputs
        working-directory: resource
        run: |
          rm -rf avatar chart illustration illustrationBlur illustrationLowRes music

      # 10. 【核心】通过修改 config.ini 进行分批处理
      - name: Run resource.py by Type (Modify Config)
        working-directory: ./resource
        run: |
          echo "开始通过修改配置分批处理..."
          echo "总开始时间: $(date)"
          
          # 定义处理顺序（包含 avatar）
          RESOURCE_TYPES=("avatar" "Chart" "illustrationBlur" "illustrationLowRes" "illustration" "music")
          
          # 记录原始配置内容，用于最后恢复
          ORIGINAL_CONFIG=$(cat config.ini)
          
          for CURRENT_TYPE in "${RESOURCE_TYPES[@]}"; do
            echo ""
            echo "======= 开始处理类型: $CURRENT_TYPE ======="
            echo "批次开始时间: $(date)"
            
            # 1. 修改 config.ini：将所有类型设为 False，然后将当前类型设为 True
            sed -i "s/^\(avatar\|Chart\|illustrationBlur\|illustrationLowRes\|illustration\|music\) = .*$/\1 = False/" config.ini
            sed -i "s/^$CURRENT_TYPE = .*$/$CURRENT_TYPE = True/" config.ini
            
            # 2. 显示修改后的配置（调试用）
            echo "修改后的 config.ini 相关部分:"
            grep -E "^(avatar|Chart|illustration|music)" config.ini
            echo "------------------------"
            
            # 3. 运行脚本（仅处理当前类型）
            echo "启动 resource.py..."
            python resource.py Phigros.apk 2>&1 | tail -30
            
            # 4. 批次结束后强制垃圾回收并稍作等待
            python3 -c "import gc; gc.collect()"
            sleep 2
            
            echo "======= 完成处理类型: $CURRENT_TYPE ======="
            echo "批次结束时间: $(date)"
          done
          
          # 所有批次完成后，恢复原始配置
          echo "$ORIGINAL_CONFIG" > config.ini
          echo "✅ 已恢复原始 config.ini 配置"
          
          echo ""
          echo "✅ 所有类型分批处理完成"
          echo "总结束时间: $(date)"

      # 11. 检查生成的资源
      - name: Check generated resources
        working-directory: ./resource
        run: |
          echo "=== 最终生成的资源统计 ==="
          for dir in avatar chart illustration illustrationBlur illustrationLowRes music; do
            if [ -d "$dir" ]; then
              COUNT=$(find "$dir" -type f 2>/dev/null | wc -l)
              SIZE=$(du -sh "$dir" 2>/dev/null | cut -f1)
              echo "$dir: $COUNT 个文件 ($SIZE)"
            fi
          done

      # 12. 检出构建产物仓库
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          ref: master
          path: build

      # 13. 发布资源到构建仓库
      - name: Publish resources
        working-directory: ./resource
        run: |
          rsync -av --delete \
            avatar chart illustration illustrationBlur illustrationLowRes music \
            ../build/

      # 14. 提交并推送更改
      - name: Commit & Push
        working-directory: ./build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "自动更新资源 (完整分批) - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin master
          fi
