name: Build Phigros Resources (Config-Based Batch)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 考虑到分批处理较慢，给予充足时间

    steps:
      # 1. 创建必要目录
      - name: Create Directories
        run: mkdir -p history resource build

      # 2. 从 Release 下载分卷包
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安装解压及音频支持工具
      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full libogg-dev libvorbis-dev rsync

      # 4. 解压并准备 APK
      - name: Extract & Prepare APK
        working-directory: ./history
        run: |
          shopt -s nullglob
          for f in *.7z.001; do 
            echo "正在解压: $f"
            7z x "$f" -y
          done
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "错误: 未找到APK文件"
            exit 1
          fi
          cp "$APK" ../resource/Phigros.apk
          echo "✅ APK 已准备就绪"

      # 5. 检出资源处理脚本仓库 (主分支)
      - name: Checkout Script Repo
        uses: actions/checkout@v4
        with:
          path: resource

      # 6. 获取并设置关键的 info 描述文件
      - name: Checkout Info Directory
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_source

      - name: Setup Info Directory
        working-directory: ./resource
        run: |
          mkdir -p info
          cp -rn ../info_source/* info/ 2>/dev/null || true
          if [ -f "info/tmp.tsv" ] && [ -f "info/difficulty.tsv" ]; then
            echo "✅ 关键描述文件准备完毕"
          else
            echo "❌ 警告: info 目录文件不全，avatar 提取可能失败"
          fi

      # 7. 设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 8. 安装 Python 依赖 (使用 PyPI 官方库)
      - name: Install Python Dependencies
        working-directory: ./resource
        run: |
          pip install UnityPy fsb5

      # 9. 清理旧输出
      - name: Clean Old Outputs
        working-directory: ./resource
        run: rm -rf avatar chart illustration illustrationBlur illustrationLowRes music

      # 10. 【核心逻辑】修改配置并分批运行
      - name: Batch Extraction via Config Modification
