name: Build Phigros Resources (Chart修复最终版)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 创建历史目录
      - name: Create History Directory
        run: mkdir -p history

      # 2. 下载全部分卷文件
      - name: Download ALL Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安装系统工具
      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget rsync curl

      # 4. 安装音频编解码器库
      - name: Install Audio Codec Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libogg-dev \
            libvorbis-dev \
            libvorbis0a \
            libvorbisenc2 \
            libvorbisfile3

      # 5. 解压并准备APK
      - name: Extract & Prepare APK
        working-directory: ./history
        run: |
          shopt -s nullglob
          for f in *.7z.001; do
            echo "解压: $f"
            7z x "$f" -y
          done
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found"
            exit 1
          fi
          cp "$APK" Phigros.apk
          rm -f *.7z.* 2>/dev/null || true

      # 6. 检出资源脚本仓库
      - name: Checkout Phigros_Resource1
        uses: actions/checkout@v4
        with:
          path: resource

      # 7. 获取 info 目录
      - name: Checkout Info Directory
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_source

      - name: Setup Info Directory
        working-directory: ./resource
        run: |
          mkdir -p info
          cp -rn ../info_source/* info/ 2>/dev/null || true
          [ -f "info/tmp.tsv" ] && echo "✅ tmp.tsv 存在" || echo "❌ tmp.tsv 缺失（将跳过avatar处理）"

      # 8. 更新APK
      - name: Update APK
        run: cp history/Phigros.apk resource/Phigros.apk

      # 9. 设置Python环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 10. 安装Python依赖
      - name: Install Python Dependencies
        working-directory: ./resource
        run: |
          pip uninstall -y fsb5 UnityPy 2>/dev/null || true
          pip install UnityPy
          pip install "git+https://github.com/HearthSim/python-fsb5.git"

      # 11. 清理旧输出
      - name: Clean Old Outputs
        working-directory: resource
        run: |
          rm -rf avatar chart illustration music

      # 12. 创建Chart专用处理脚本（避免修改resource.py）
      - name: Create Chart Processor
        working-directory: ./resource
        run: |
          echo "创建Chart专用处理脚本..."
          
          cat > extract_chart.py << 'EOF'
#!/usr/bin/env python3
"""
Chart专用提取脚本
跳过TEmoji等可能导致卡住的文件
"""
import UnityPy
import os
import json

def extract_chart():
    print("=== Chart专用提取开始 ===")
    
    apk_path = 'Phigros.apk'
    if not os.path.exists(apk_path):
        print(f"错误: APK文件不存在: {apk_path}")
        return False
    
    output_dir = 'chart'
    os.makedirs(output_dir, exist_ok=True)
    
    # 跳过列表
    skip_files = [
        "TEmoji",
        "emoji", 
        "Emoji",
        "Tutorial",
        "Debug",
        "Test",
        "Editor",
        "Default"
    ]
    
    try:
        env = UnityPy.load(apk_path)
        chart_count = 0
        skip_count = 0
        error_count = 0
        
        print(f"加载APK成功，总共 {len(list(env.objects))} 个对象")
        
        for obj in env.objects:
            try:
                if obj.type.name == "TextAsset" and "Chart" in obj.path:
                    path = obj.path
                    
                    # 检查是否需要跳过
                    should_skip = False
                    for skip_word in skip_files:
                        if skip_word.lower() in path.lower():
                            print(f"跳过: {path}")
                            skip_count += 1
                            should_skip = True
                            break
                    
                    if should_skip:
                        continue
                    
                    # 提取Chart
                    data = obj.read()
                    if hasattr(data, 'script'):
                        text = data.script.decode('utf-8', errors='ignore')
                        
                        # 保存文件
                        filename = os.path.basename(path).replace('/', '_').replace('\\', '_')
                        if not filename.endswith('.txt'):
                            filename += '.txt'
                        
                        output_path = os.path.join(output_dir, filename)
                        
                        with open(output_path, 'w', encoding='utf-8') as f:
                            f.write(text)
                        
                        chart_count += 1
                        
                        # 每10个文件报告一次进度
                        if chart_count % 10 == 0:
                            print(f"已提取 {chart_count} 个Chart文件")
                    
            except Exception as e:
                print(f"处理文件时出错 {obj.path}: {e}")
                error_count += 1
                continue
        
        print(f"\n=== Chart提取完成 ===")
        print(f"✅ 成功提取: {chart_count} 个文件")
        print(f"➡️  跳过: {skip_count} 个文件")
        print(f"❌ 错误: {error_count} 个文件")
        
        return chart_count > 0
        
    except Exception as e:
        print(f"加载APK失败: {e}")
        import traceback
        traceback.print_exc()
        return False

if __name__ == "__main__":
    success = extract_chart()
    exit(0 if success else 1)
EOF
          
          chmod +x extract_chart.py
          echo "✅ Chart专用脚本创建完成"

      # 13. 核心分批处理（使用专用脚本处理Chart）
      - name: Run Resource Extraction
        working-directory: ./resource
        run: |
          echo "开始核心资源分批处理..."
          
          # 处理顺序：先处理其他类型，最后处理Chart
          CORE_TYPES=("illustration" "music")
          [ -f "info/tmp.tsv" ] && CORE_TYPES=("avatar" "${CORE_TYPES[@]}")
          
          echo "第一阶段处理: ${CORE_TYPES[*]}"
          
          # 备份配置
          [ -f "config.ini" ] && cp config.ini config.ini.backup
          
          SUCCESS_TYPES=""
          FAILED_TYPES=""
          
          # 第一阶段：处理除Chart外的所有类型
          for CURRENT_TYPE in "${CORE_TYPES[@]}"; do
            echo ""
            echo "======= 处理类型: $CURRENT_TYPE ======="
            echo "开始时间: $(date)"
            
            if [ "$CURRENT_TYPE" = "avatar" ] && [ ! -f "info/tmp.tsv" ]; then
              echo "⚠️ 跳过avatar（缺少tmp.tsv）"
              continue
            fi
            
            # 修改配置
            sed -i "s/^\(avatar\|chart\|illustration\|music\) = .*$/\\1 = False/" config.ini 2>/dev/null
            sed -i "s/^$CURRENT_TYPE = .*$/$CURRENT_TYPE = True/" config.ini 2>/dev/null
            
            echo "启动提取进程..."
            timeout 900 python resource.py Phigros.apk 2>&1 | tail -50
            
            EXIT_CODE=${PIPESTATUS[0]}
            
            if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 137 ]; then
              echo "❌ $CURRENT_TYPE 超时"
              FAILED_TYPES="$FAILED_TYPES $CURRENT_TYPE"
            elif [ $EXIT_CODE -eq 0 ]; then
              echo "✅ $CURRENT_TYPE 成功"
              SUCCESS_TYPES="$SUCCESS_TYPES $CURRENT_TYPE"
            else
              echo "❌ $CURRENT_TYPE 失败（代码:$EXIT_CODE）"
              FAILED_TYPES="$FAILED_TYPES $CURRENT_TYPE"
            fi
            
            python3 -c "import gc; gc.collect()"
            sleep 2
            echo "结束时间: $(date)"
          done
          
          # 第二阶段：使用专用脚本处理Chart
          echo ""
          echo "======= 处理类型: Chart ======="
          echo "开始时间: $(date)"
          echo "使用专用脚本处理Chart..."
          
          timeout 1800 python extract_chart.py 2>&1
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 137 ]; then
            echo "❌ Chart 超时"
            FAILED_TYPES="$FAILED_TYPES Chart"
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Chart 成功"
            SUCCESS_TYPES="$SUCCESS_TYPES Chart"
            
            # 检查提取的文件数量
            if [ -d "chart" ]; then
              COUNT=$(find chart -name "*.txt" 2>/dev/null | wc -l)
              echo "📊 生成 $COUNT 个Chart文件"
            fi
          else
            echo "❌ Chart 失败（代码:$EXIT_CODE）"
            FAILED_TYPES="$FAILED_TYPES Chart"
          fi
          
          # 恢复配置
          [ -f "config.ini.backup" ] && mv config.ini.backup config.ini
          
          # 清理专用脚本
          rm -f extract_chart.py 2>/dev/null || true
          
          # 最终报告
          echo ""
          echo "======= 处理完成 ======="
          echo "✅ 成功: $SUCCESS_TYPES"
          [ -n "$FAILED_TYPES" ] && echo "❌ 失败: $FAILED_TYPES"
          echo "总结束时间: $(date)"
          
          # 判断是否继续
          if [[ "$SUCCESS_TYPES" == *"illustration"* ]] || [[ "$SUCCESS_TYPES" == *"music"* ]]; then
            echo "✅ 有成功提取的类型，继续工作流"
          else
            echo "❌ 没有成功提取任何类型，工作流失败"
            exit 1
          fi

      # 14. 验证生成资源
      - name: Verify Generated Resources
        working-directory: ./resource
        run: |
          echo "=== 生成资源验证 ==="
          TOTAL_COUNT=0
          for dir in avatar chart illustration music; do
            if [ -d "$dir" ] && [ -n "$(ls -A $dir 2>/dev/null)" ]; then
              COUNT=$(find "$dir" -type f 2>/dev/null | wc -l)
              SIZE=$(du -sh "$dir" 2>/dev/null | cut -f1)
              echo "✅ $dir: $COUNT 文件 ($SIZE)"
              TOTAL_COUNT=$((TOTAL_COUNT + COUNT))
            else
              echo "➖ $dir: 未生成或为空"
            fi
          done
          echo "总计: $TOTAL_COUNT 个资源文件"
          
          # 特别检查Chart文件
          if [ -d "chart" ]; then
            TXT_COUNT=$(find chart -name "*.txt" 2>/dev/null | wc -l)
            echo "📊 Chart文件详情: $TXT_COUNT 个.txt文件"
          fi

      # 15. 检出发布仓库
      - name: Checkout Build Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          ref: master
          path: build

      # 16. 发布资源
      - name: Publish Resources
        working-directory: ./resource
        run: |
          echo "正在发布资源..."
          for dir in avatar chart illustration music; do
            if [ -d "$dir" ] && [ -n "$(ls -A $dir 2>/dev/null)" ]; then
              echo "发布 $dir..."
              mkdir -p ../build/$dir
              rsync -av --delete "$dir/" "../build/$dir/"
            fi
          done
          echo "✅ 资源发布完成"

      # 17. 提交更改
      - name: Commit Changes
        working-directory: ./build
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动更新资源 [$(date +'%Y-%m-%d %H:%M')]"
            git push origin master
            echo "✅ 变更已提交"
          fi

      # 18. 最终状态报告
      - name: Final Status Report
        run: |
          echo "=== 工作流执行完成 ==="
          echo "完成时间: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "运行器: $(uname -a)"
          echo "磁盘状态:"
          df -h | grep -E "Filesystem|/dev/root"
