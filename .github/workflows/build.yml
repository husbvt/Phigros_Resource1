name: Phigros Batch Extraction Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: 1. 检出脚本仓库
        uses: actions/checkout@v4
        with:
          path: resource

      # --- 关键修复：插件必须独立于 run 块之外 ---
      - name: 2. 下载 APK 分卷包
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./downloads"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. 解压并强制移动 APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full rsync
          
          # 解压分卷包
          mkdir -p ./extracted
          7z x "downloads/*.7z.001" -o./extracted -y || echo "⚠️ 7z 解压跳过或失败"
          
          # 搜索 APK 并移动到 resource 目录
          echo "🔎 正在定位 APK 文件..."
          FOUND_APK=$(find . -name "*.apk" -type f | head -n 1)
          
          if [ -z "$FOUND_APK" ]; then
            echo "❌ 错误：未找到 APK！请检查下载步骤的输出。"
            ls -R downloads/
            exit 1
          fi
          
          echo "✅ 找到 APK: $FOUND_APK"
          # 确保脚本目录下有且仅有这个 Phigros.apk
          cp "$FOUND_APK" ./resource/Phigros.apk
          echo "📏 APK 大小: $(ls -lh ./resource/Phigros.apk | awk '{print $5}')"

      - name: 4. 环境与依赖安装
        run: |
          sudo apt-get install -y libogg-dev libvorbis-dev
          pip install UnityPy==1.10.18 fsb5

      - name: 5. 检出目标仓库 (husbvt)
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 6. 自动化分批提取 (方案二)
        working-directory: ./resource
        run: |
          # 强制将并发改为 1，解决 7GB 内存卡死问题
          sed -i 's/ThreadPoolExecutor(6)/ThreadPoolExecutor(1)/g' resource.py

          run_batch() {
            local task=$1
            echo "------------------------------------------"
            echo "🚀 执行任务: $task"
            # 自动化修改 config.ini 开关 (I 表示不区分大小写)
            sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
            
            if [ "$task" == "Chart" ]; then
              sed -i -E "s/^Chart[[:space:]]*=.*/Chart = True/I" config.ini
            else
              sed -i -E "s/^$task[[:space:]]*=.*/$task = True/I" config.ini
            fi
            
            # 运行提取逻辑
            python resource.py Phigros.apk || echo "⚠️ $task 提取中断"
          }

          run_batch "avatar"
          run_batch "Chart"
          run_batch "music"
          run_batch "illustration"

      - name: 7. 健壮推送至 husbvt 仓库
        working-directory: ./resource
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.quotepath false

          # 增量同步资源
          for folder in avatar chart illustration music; do
            if [ -d "$folder" ] && [ "$(ls -A $folder 2>/dev/null)" ]; then
              echo "✅ 同步 $folder 文件夹内容..."
              mkdir -p "../build_repo/$folder"
              rsync -av "$folder/" "../build_repo/$folder/"
            fi
          done

          cd ../build_repo
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto Update Resources: $(date +'%Y-%m-%d %H:%M')"
            git push "https://${AUTH_TOKEN}@github.com/husbvt/Phigros_Resource_Build.git" master --force
          else
            echo "✨ 仓库无变化，跳过推送。"
          fi
