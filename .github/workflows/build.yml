name: Build Phigros Resources (Final Fixed)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 初始化目录
      - name: Create Directories
        run: mkdir -p history resource build_repo

      # 2. 下载资源
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安装工具
      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full libogg-dev libvorbis-dev rsync

      # 4. 【修复路径】解压并确保 APK 移入 resource 目录
      - name: Extract & Prepare APK
        run: |
          shopt -s nullglob
          cd history
          for f in *.7z.001; do 
            7z x "$f" -y
          done
          # 寻找解压出的 APK
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 未找到 APK 文件"
            exit 1
          fi
          # 核心修正：将其复制到 resource 根目录，并统一命名为 Phigros.apk
          cp "$APK_PATH" ../resource/Phigros.apk
          echo "✅ APK 已就绪并移动至: resource/Phigros.apk"

      # 5. 检出脚本
      - name: Checkout Script Repo
        uses: actions/checkout@v4
        with:
          path: resource

      # 6. 设置描述信息 (info)
      - name: Checkout Info Directory
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_source

      - name: Setup Info Directory
        working-directory: ./resource
        run: |
          mkdir -p info
          cp -rn ../info_source/* info/ 2>/dev/null || true

      # 7. Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 8. 依赖安装
      - name: Install Python Dependencies
        working-directory: ./resource
        run: pip install UnityPy fsb5

      # 9. 清理与创建目录
      - name: Pre-clean
        working-directory: ./resource
        run: |
          rm -rf avatar chart illustration illustrationBlur illustrationLowRes music
          mkdir -p avatar chart illustration illustrationBlur illustrationLowRes music

      # 10. 【路径加固】分批修改配置并运行
      - name: Batch Extraction
        working-directory: ./resource
        run: |
          # 再次检查 APK 是否存在，防止脚本报错
          if [ ! -f "Phigros.apk" ]; then
            echo "❌ 错误：在 $(pwd) 找不到 Phigros.apk"
            exit 1
          fi
          
          TYPES=("avatar" "Chart" "illustration" "illustrationBlur" "illustrationLowRes" "music")
          cp config.ini config.ini.bak
          
          for CURRENT in "${TYPES[@]}"; do
            echo "------------------------------------------"
            echo "🚀 批次开始: $CURRENT"
            
            # 修改配置（忽略大小写）
            for T in "${TYPES[@]}"; do
              sed -i -E "s/^$T[[:space:]]*=[[:space:]]*.*/$T = False/I" config.ini
            done
            sed -i -E "s/^$CURRENT[[:space:]]*=[[:space:]]*.*/$CURRENT = True/I" config.ini
            
            # 运行脚本
            timeout 1500 python resource.py Phigros.apk || echo "⚠️ $CURRENT 批次跳过"
            
            python3 -c "import gc; gc.collect()"
            sleep 2
          done
          mv config.ini.bak config.ini

      # 11. 验证
      - name: Verify Results
        working-directory: ./resource
        run: |
          echo "=== 最终生成统计 ==="
          ls -R avatar chart illustration music | grep ":$" | sed -e 's/:$//' -e 's/[^-][^\/]*\//--/g' -e 's/^/   /'
          find avatar chart illustration music -type f | wc -l

      # 12. 发布
      - name: Checkout Build Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: Sync & Push
        working-directory: ./resource
        run: |
          for folder in avatar chart illustration illustrationBlur illustrationLowRes music; do
            if [ -d "$folder" ] && [ "$(ls -A $folder)" ]; then
              mkdir -p ../build_repo/$folder
              rsync -av --delete "$folder/" "../build_repo/$folder/"
            fi
          done
          cd ../build_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto Update [$(date +'%Y-%m-%d %H:%M')]"
            git push origin master
          fi
