name: Phigros Full Auto Extraction

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 1. Checkout Script Repo
        uses: actions/checkout@v4
        with:
          path: resource

      - name: 2. Download & Extract APK
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Prepare APK & Info
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          # 解压并移动 APK
          cd history
          7z x "*.7z.001" -y
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          mv "$APK_PATH" ../resource/Phigros.apk
          cd ..
          # 准备头像所需的 info (如果有外部源请在此检出)
          mkdir -p resource/info

      - name: 4. Setup Python & Deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 5. Install Dependencies
        run: |
          sudo apt-get install -y libogg-dev libvorbis-dev
          pip install UnityPy==1.10.18 fsb5

      - name: 6. Execution (Multi-Stage Auto)
        working-directory: ./resource
        run: |
          # 修改源码并发为 1，防止 Action 7GB 内存崩溃 
          sed -i 's/ThreadPoolExecutor(6)/ThreadPoolExecutor(1)/g' resource.py

          # 自动化提取函数
          run_extract() {
            TASK=$1
            echo "------------------------------------------"
            echo "🚀 正在提取: $TASK"
            # 修改 config.ini 开关
            sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
            
            if [ "$TASK" == "Chart" ]; then
              sed -i -E "s/^Chart[[:space:]]*=.*/Chart = True/I" config.ini
            else
              sed -i -E "s/^$TASK[[:space:]]*=.*/$TASK = True/I" config.ini
            fi

            # 运行脚本
            timeout 2400 python resource.py Phigros.apk || echo "⚠️ $TASK 提取异常"
          }

          # 依次执行所有任务
          run_extract "avatar"
          run_extract "Chart"
          run_extract "music"
          run_extract "illustration"

      - name: 7. Checkout Build Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 8. Sync & Push (Fixed)
        working-directory: ./resource
        run: |
          # 仅同步有内容的目录
          for folder in avatar chart illustration music; do
            if [ -d "$folder" ] && [ "$(ls -A $folder)" ]; then
              mkdir -p ../build_repo/$folder
              rsync -av --delete "$folder/" "../build_repo/$folder/"
            fi
          done

          cd ../build_repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          # 检查是否有变化，防止 git commit 报错导致红叉
          if ! git diff --cached --quiet; then
            git commit -m "Auto Update Resources"
            git push origin master
          else
            echo "No changes to commit"
          fi
