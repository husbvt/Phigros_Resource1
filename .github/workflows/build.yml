name: Phigros Full Resources Final

on:
  # 1. 手动触发按钮（保留）
  workflow_dispatch:
  
  # 2. 定时触发：每三天凌晨2点执行
  schedule:
    - cron: '0 2 */3 * *'  # 每3天执行一次

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      # 新增：显示触发信息
      - name: 0. 显示触发信息
        run: |
          echo "🎯 工作流触发方式: ${{ github.event_name }}"
          echo "📅 当前时间: $(date)"
          echo "⏰ 事件类型: ${{ github.event.action || 'schedule/manual' }}"
          
      - name: 1. 获取上游发布信息
        id: get-release
        run: |
          echo "🔍 正在检查上游仓库更新..."
          
          # 使用GitHub API获取最新发布信息
          API_URL="https://api.github.com/repos/SteveZMTstudios/Phigros-history/releases/latest"
          
          # 添加重试机制
          for i in {1..3}; do
            RESPONSE=$(curl -s \
              -H "Accept: application/vnd.github.v3+json" \
              -H "User-Agent: Phigros-Resource-Updater" \
              "$API_URL") || true
              
            if [ -n "$RESPONSE" ] && [ "$RESPONSE" != "null" ]; then
              break
            fi
            echo "⚠️ 第 $i 次尝试失败，10秒后重试..."
            sleep 10
          done
          
          # 解析JSON响应
          TAG_NAME=$(echo "$RESPONSE" | jq -r '.tag_name // empty' 2>/dev/null || echo "")
          PUBLISHED_AT=$(echo "$RESPONSE" | jq -r '.published_at // empty' 2>/dev/null || echo "")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty' 2>/dev/null || echo "")
          
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            echo "❌ 无法获取上游仓库版本信息"
            echo "has_update=false" >> $GITHUB_OUTPUT
            exit 0  # 非致命错误，优雅退出
          fi
          
          echo "✅ 上游最新版本: $TAG_NAME"
          echo "📅 发布时间: $PUBLISHED_AT"
          echo "🆔 发布ID: $RELEASE_ID"
          
          # 使用新的环境文件语法替代 set-output
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "published_at=$PUBLISHED_AT" >> $GITHUB_OUTPUT
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "has_update=true" >> $GITHUB_OUTPUT
      
      - name: 2. 判断是否需要更新
        id: should-update
        run: |
          # 如果是手动触发，总是执行
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🔧 手动触发，强制执行更新"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "reason=manual_trigger" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # 定时触发时，检查版本是否变化
          CURRENT_TAG="${{ steps.get-release.outputs.tag_name }}"
          
          # 尝试从GitHub缓存/文件中读取上次处理的版本
          echo "尝试读取上次处理的版本..."
          LAST_TAG=""
          
          # 创建一个简单的版本记录文件
          if [ -f "last_version.txt" ]; then
            LAST_TAG=$(cat last_version.txt)
            echo "📖 读取到上次版本: $LAST_TAG"
          else
            echo "📖 无版本记录文件，首次运行"
          fi
          
          # 比较版本
          if [ -z "$LAST_TAG" ] || [ "$CURRENT_TAG" != "$LAST_TAG" ]; then
            echo "🔄 检测到版本变化: $LAST_TAG -> $CURRENT_TAG"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "reason=new_version" >> $GITHUB_OUTPUT
            
            # 保存当前版本
            echo "$CURRENT_TAG" > last_version.txt
            echo "💾 已保存当前版本: $CURRENT_TAG"
          else
            echo "✅ 版本未变化，跳过构建: $CURRENT_TAG"
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "reason=no_change" >> $GITHUB_OUTPUT
          fi
      
      - name: 3. 检出脚本仓库（条件性）
        if: steps.should-update.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          path: resource

      - name: 4. 下载 APK 分卷包（条件性）
        if: steps.should-update.outputs.should_build == 'true'
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z*"
          out-file-path: "./downloads"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. 解压并定位 APK（条件性）
        if: steps.should-update.outputs.should_build == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full rsync
          mkdir -p ./extracted
          
          # 核心修改：优先尝试解压分卷，如果失败则尝试解压普通 7z
          if [ -f downloads/*.7z.001 ]; then
            7z x "downloads/*.7z.001" -o./extracted -y
          else
            7z x "downloads/*.7z" -o./extracted -y
          fi
          
          FOUND_APK=$(find ./extracted -name "*.apk" -type f | head -n 1)
          if [ -z "$FOUND_APK" ]; then echo "❌ APK NOT FOUND"; exit 1; fi
          mkdir -p ./resource
          cp "$FOUND_APK" ./resource/Phigros.apk


      - name: 6. 环境与依赖（条件性）
        if: steps.should-update.outputs.should_build == 'true'
        run: |
          sudo apt-get install -y libogg-dev libvorbis-dev
          pip install UnityPy==1.10.18 fsb5

      - name: 7. 检出目标仓库 (husbvt)（条件性）
        if: steps.should-update.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 8. 自动化分阶段提取（条件性）
        if: steps.should-update.outputs.should_build == 'true'
        working-directory: ./resource
        run: |
          # 显示触发原因
          echo "🚀 开始提取资源 - 触发原因: ${{ steps.should-update.outputs.reason }}"
          echo "🏷️  目标版本: ${{ steps.get-release.outputs.tag_name || '手动触发' }}"
          
          # 强制并发为 1
          sed -i 's/ThreadPoolExecutor(6)/ThreadPoolExecutor(1)/g' resource.py

          # --- 1. 提取头像 (Avatar) ---
          echo "🚀 Processing: avatar"
          sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          sed -i -E "s/^avatar[[:space:]]*=.*/avatar = True/I" config.ini
          python resource.py Phigros.apk || echo "Skip"
          # 检查多个可能的输出目录名 (avatar 或 Avatar)
          for d in avatar Avatar; do
            if [ -d "$d" ] && [ "$(ls -A "$d" 2>/dev/null)" ]; then
              rsync -av "$d/" "../build_repo/avatar/"
              rm -rf "$d"/*
            fi
          done

          # --- 2. 提取谱面 (Chart) ---
          echo "🚀 Processing: Chart"
          sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          sed -i -E "s/^Chart[[:space:]]*=.*/Chart = True/I" config.ini
          python resource.py Phigros.apk || echo "Skip"
          if [ -d "chart" ]; then rsync -av "chart/" "../build_repo/chart/"; rm -rf "chart"/*; fi

          # --- 3. 提取音乐 (music) ---
          echo "🚀 Processing: music"
          sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          sed -i -E "s/^music[[:space:]]*=.*/music = True/I" config.ini
          python resource.py Phigros.apk || echo "Skip"
          if [ -d "music" ]; then rsync -av "music/" "../build_repo/music/"; rm -rf "music"/*; fi

          # --- 4. 提取曲绘 (illustration) ---
          echo "🚀 Processing: illustration"
          sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          sed -i -E "s/^illustration[[:space:]]*=.*/illustration = True/I" config.ini
          python resource.py Phigros.apk || echo "Skip"
          if [ -d "illustration" ]; then rsync -av "illustration/" "../build_repo/illustration/"; rm -rf "illustration"/*; fi

      - name: 9. 最终推送至 husbvt 仓库（条件性）
        if: steps.should-update.outputs.should_build == 'true'
        working-directory: ./build_repo
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.quotepath false

          echo "📊 Final Size Check:"
          du -sh ./*

          # 构建提交信息
          COMMIT_MSG="Auto Update Resources: $(date +'%Y-%m-%d %H:%M')"
          if [ -n "${{ steps.get-release.outputs.tag_name }}" ]; then
            COMMIT_MSG="$COMMIT_MSG - Version: ${{ steps.get-release.outputs.tag_name }}"
          fi
          COMMIT_MSG="$COMMIT_MSG [Trigger: ${{ steps.should-update.outputs.reason }}]"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
            # 明确推送到 master 分支
            git push "https://${AUTH_TOKEN}@github.com/husbvt/Phigros_Resource_Build.git" HEAD:master --force
            echo "✅ 资源已成功推送"
          else
            echo "✅ 无变化可推送"
          fi
      
      - name: 10. 完成通知
        run: |
          echo "========================================"
          echo "🏁 工作流执行完成"
          echo "触发方式: ${{ github.event_name }}"
          echo "构建执行: ${{ steps.should-update.outputs.should_build || 'false' }}"
          echo "执行原因: ${{ steps.should-update.outputs.reason || 'N/A' }}"
          if [ "${{ steps.should-update.outputs.should_build }}" = "true" ]; then
            echo "✅ 资源更新流程已执行"
          else
            echo "⏭️  资源更新已跳过（无新版本）"
          fi
          echo "========================================"
