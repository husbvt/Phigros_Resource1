name: Build Phigros Resources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Phigros-history
        uses: actions/checkout@v4
        with:
          repository: SteveZMTstudios/Phigros-history
          path: history

      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      # >>> 这里是新添加的调试步骤 <<<
      - name: Debug List History Directory (Before Extract)
        working-directory: ./history
        run: |
          echo "=== 列出 history 目录的所有文件 ==="
          find . -type f | sort || echo "find命令执行失败"
          echo "=== 列出所有 .7z* 文件 ==="
          find . -name "*.7z*" 2>/dev/null | sort || echo "未找到.7z文件"
          echo "=== 列出所有 .apk 文件 ==="
          find . -name "*.apk" 2>/dev/null | sort || echo "未找到.apk文件"

      - name: Extract & Prepare APK
        working-directory: ./history
        run: |
          shopt -s nullglob
          echo "开始解压，当前目录下的.7z.001文件有："
          ls -la *.7z.001 2>/dev/null || echo "未直接匹配到*.7z.001文件"

          for f in *.7z.001; do
            echo "解压: $f"
            7z x "$f"
          done

          echo "=== 解压后搜索APK文件 ==="
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ 错误：未找到任何.apk文件。"
            echo "当前目录结构："
            find . -type f | sort
            exit 1
          fi

          echo "找到APK: $APK"
          cp "$APK" Phigros.apk

      - name: Checkout Phigros_Resource1
        uses: actions/checkout@v4
        with:
          path: resource

      - name: Update APK
        run: cp history/Phigros.apk resource/Phigros.apk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Clean old outputs
        working-directory: resource
        run: |
          rm -rf avatar chart illustration illustrationBlur illustrationLowRes music

      - name: Run resources.py
        working-directory: resource
        run: python resources.py

      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          ref: master
          path: build

      - name: Publish resources
        working-directory: ./resource
        run: |
          rsync -av --delete \
            avatar \
            chart \
            illustration \
            illustrationBlur \
            illustrationLowRes \
            music \
            ../build/

      - name: Commit & Push
        working-directory: ./build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto update"
            git push origin master
          fi
