name: Build Phigros Resources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 创建历史目录
      - name: Create History Directory
        run: mkdir -p history

      # 2. 从Release下载全部分卷文件
      - name: Download ALL Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 安装解压工具
      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      # 4. 安装音频编解码器库
      - name: Install audio codec libraries
        run: |
          echo "安装音频编解码器库..."
          sudo apt-get update
          sudo apt-get install -y \
            libvorbis-dev \
            libvorbis0a \
            libvorbisenc2 \
            libvorbisfile3 \
            ffmpeg \
            libavcodec-dev
          echo "音频库安装完成"

      # 5. 解压分卷包并提取APK
      - name: Extract & Prepare APK
        working-directory: ./history
        run: |
          shopt -s nullglob
          echo "当前目录分卷文件:"
          ls -la *.7z.001 2>/dev/null || echo "未找到.7z.001文件"
          for f in *.7z.001; do
            echo "解压: $f"
            7z x "$f"
          done
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found"
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" Phigros.apk

      # 6. 检出资源处理脚本仓库
      - name: Checkout Phigros_Resource1
        uses: actions/checkout@v4
        with:
          path: resource

      # 7. 更新APK文件
      - name: Update APK
        run: cp history/Phigros.apk resource/Phigros.apk

      # 8. 设置Python环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 9. 安装Python依赖
      - name: Install Python dependencies
        working-directory: ./resource
        run: |
          echo "正在安装Python依赖包..."
          pip install UnityPy fsb5
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          echo "依赖安装完成。"

      # 10. 清理旧的输出文件
      - name: Clean old outputs
        working-directory: resource
        run: |
          rm -rf avatar chart illustration illustrationBlur illustrationLowRes music

      # 11. 【关键】增加系统内存和交换空间
      - name: Increase system resources
        run: |
          echo "=== 增加系统资源 ==="
          # 增加交换空间 (4GB)
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 调整系统限制
          sudo sysctl -w vm.swappiness=60
          sudo sysctl -w vm.vfs_cache_pressure=50
          
          echo "✅ 系统资源已优化"
          free -h
          df -h

      # 12. 运行资源提取脚本（带资源监控）
      - name: Run resource.py
        working-directory: resource
        run: |
          echo "正在运行 resource.py 脚本..."
          echo "开始时间: $(date)"
          
          # 监控资源使用的后台任务
          (while true; do
            echo "=== 资源监控 $(date +%H:%M:%S) ==="
            free -m | awk 'NR==2{printf "内存: %.2f%% (%.0fM/%.0fM)\n", $3/$2*100, $3/1024, $2/1024}'
            df -h . | awk 'NR==2{printf "磁盘: %s已用(剩余%s)\n", $5, $4}'
            sleep 30
          done) &
          MONITOR_PID=$!
          
          # 运行脚本，增加Python内存管理和超时设置
          timeout 1800 python -X pycache_prefix=/tmp/pycache -X warn_default_encoding resource.py Phigros.apk || SCRIPT_EXIT=$?
          
          # 停止监控
          kill $MONITOR_PID 2>/dev/null || true
          
          # 检查退出状态
          if [ ${SCRIPT_EXIT:-0} -eq 0 ]; then
            echo "✅ 资源提取完成"
            echo "结束时间: $(date)"
          elif [ ${SCRIPT_EXIT:-0} -eq 124 ]; then
            echo "⚠️ 脚本执行超时 (30分钟)"
            exit 1
          else
            echo "❌ 脚本执行失败，退出代码: ${SCRIPT_EXIT}"
            echo "最后处理的文件可能在上一行日志中"
            exit 1
          fi

      # 13. 调试：检查生成的资源
      - name: Debug - Check generated resources
        working-directory: ./resource
        run: |
          echo "=== 生成的资源文件夹大小 ==="
          du -sh avatar/ chart/ illustration/ music/ 2>/dev/null || echo "某个目录不存在"
          echo "=== 各目录文件数量 ==="
          for dir in avatar chart illustration illustrationBlur illustrationLowRes music; do
            if [ -d "$dir" ]; then
              count=$(find "$dir" -type f | wc -l)
              echo "$dir: $count 个文件"
            else
              echo "$dir: 目录不存在"
            fi
          done

      # 14. 检出构建产物仓库
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          ref: master
          path: build

      # 15. 发布资源到构建仓库
      - name: Publish resources
        working-directory: ./resource
        run: |
          echo "正在同步资源到build目录..."
          rsync -av --delete \
            avatar \
            chart \
            illustration \
            illustrationBlur \
            illustrationLowRes \
            music \
            ../build/
          echo "✅ 资源同步完成"

      # 16. 提交并推送更改
      - name: Commit & Push
        working-directory: ./build
        run: |
          echo "准备提交更改..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "没有检测到更改，跳过提交。"
          else
            git commit -m "自动更新资源 - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin master
            echo "✅ 更改已提交并推送"
          fi
