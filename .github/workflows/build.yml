name: Phigros Auto Extraction (Fixed Path)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Script Repo
        uses: actions/checkout@v4
        with:
          path: resource

      # 1. 确保下载并正确解压 APK
      - name: Download & Extract APK
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK File
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          cd history
          # 解压 7z 分卷包
          7z x "*.7z.001" -y
          # 找到解压出来的 .apk 文件
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 错误：未在解压结果中找到 APK 文件"
            exit 1
          fi
          # 【关键修复】将 APK 移动到 resource 目录并重命名为脚本预期的 Phigros.apk
          mv "$APK_PATH" ../resource/Phigros.apk
          echo "✅ APK 已就绪：resource/Phigros.apk"

      # 2. 准备 info 描述文件 (头像提取必需)
      - name: Checkout Info Directory
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_source

      - name: Setup Info
        run: |
          mkdir -p resource/info
          cp -rn info_source/* resource/info/ 2>/dev/null || true

      - name: Setup Python & Deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          sudo apt-get install -y libogg-dev libvorbis-dev
          # 根据你的 requirements.txt 安装
          pip install UnityPy==1.10.18 fsb5 

      # 3. 执行自动化提取逻辑
      - name: Execution with Auto-Config
        working-directory: ./resource
        run: |
          # 降低并发防止 Actions 内存崩溃
          sed -i 's/ThreadPoolExecutor(6)/ThreadPoolExecutor(1)/g' resource.py

          run_task() {
            TASK_NAME=$1
            echo "------------------------------------------"
            echo "🚀 正在自动化提取: $TASK_NAME"
            
            # 初始化 config.ini
            sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
            
            if [ "$TASK_NAME" == "Chart" ]; then
              sed -i -E "s/^Chart[[:space:]]*=.*/Chart = True/I" config.ini
            else
              sed -i -E "s/^$TASK_NAME[[:space:]]*=.*/$TASK_NAME = True/I" config.ini
            fi

            # 运行脚本，现在 Phigros.apk 就在当前目录下
            timeout 1800 python resource.py Phigros.apk || echo "⚠️ $TASK_NAME 提取异常"
          }

          run_task "avatar"
          run_task "Chart"
          run_task "music"
          run_task "illustration"

      - name: Checkout Build Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: Sync & Push
        working-directory: ./resource
        run: |
          for folder in avatar chart illustration music; do
            if [ -d "$folder" ] && [ "$(ls -A $folder)" ]; then
              mkdir -p ../build_repo/$folder
              rsync -av --delete "$folder/" "../build_repo/$folder/"
            fi
          done
          cd ../build_repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto Update Resources" || exit 0
          git push origin master
