name: Build Phigros Resources (Final Fixed V2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 先检出脚本仓库（必须放在最前面，防止覆盖后面的文件）
      - name: Checkout Script Repo
        uses: actions/checkout@v4
        with:
          path: resource

      # 2. 创建下载目录
      - name: Create History Directory
        run: mkdir -p history

      # 3. 下载资源
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 解压并将 APK 放入 resource 目录
      - name: Extract & Prepare APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          shopt -s nullglob
          cd history
          7z x "*.7z.001" -y
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ 未找到 APK"
            exit 1
          fi
          # 移动到 resource 根目录
          mv "$APK_FILE" ../resource/Phigros.apk
          echo "✅ APK 已移动至: resource/Phigros.apk"

      # 5. 获取 Info 描述文件
      - name: Checkout Info Directory
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_source

      - name: Setup Info Directory
        run: |
          mkdir -p resource/info
          cp -rn info_source/* resource/info/ 2>/dev/null || true

      # 6. 设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 7. 安装依赖与运行处理（分批逻辑）
      - name: Batch Extraction
        working-directory: ./resource
        run: |
          pip install UnityPy fsb5
          
          # 再次强制确认文件存在
          if [ ! -f "Phigros.apk" ]; then
            echo "❌ 严重错误：Phigros.apk 丢失！"
            ls -R ..
            exit 1
          fi

          TYPES=("avatar" "Chart" "illustration" "illustrationBlur" "illustrationLowRes" "music")
          cp config.ini config.ini.bak
          
          for CURRENT in "${TYPES[@]}"; do
            echo "------------------------------------------"
            echo "🚀 正在提取: $CURRENT"
            # 修改配置
            for T in "${TYPES[@]}"; do
              sed -i -E "s/^$T[[:space:]]*=[[:space:]]*.*/$T = False/I" config.ini
            done
            sed -i -E "s/^$CURRENT[[:space:]]*=[[:space:]]*.*/$CURRENT = True/I" config.ini
            
            # 运行脚本
            timeout 1500 python resource.py Phigros.apk || echo "⚠️ $CURRENT 跳过"
            sleep 2
          done
          mv config.ini.bak config.ini

      # 8. 发布资源
      - name: Checkout Build Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: Sync & Push
        working-directory: ./resource
        run: |
          for folder in avatar chart illustration illustrationBlur illustrationLowRes music; do
            if [ -d "$folder" ] && [ "$(ls -A $folder)" ]; then
              mkdir -p ../build_repo/$folder
              rsync -av --delete "$folder/" "../build_repo/$folder/"
            fi
          done
          cd ../build_repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto Update" || exit 0
          git push origin master
