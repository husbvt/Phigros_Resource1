name: Build Phigros Resources (Isolated Batch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 环境初始化
      - name: Checkout Script Repo
        uses: actions/checkout@v4
        with:
          path: resource

      # 2. 下载并解压 APK
      - name: Download & Extract APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          mkdir -p history
          # 此处使用你之前的下载逻辑（robinraju/release-downloader）
          # 请确保 secrets.GITHUB_TOKEN 存在
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "SteveZMTstudios/Phigros-history"
          latest: true
          fileName: "*.7z.*"
          out-file-path: "./history"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK File
        run: |
          shopt -s nullglob
          cd history
          7z x "*.7z.001" -y
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then exit 1; fi
          mv "$APK_FILE" ../resource/Phigros.apk

      # 3. 设置 Info 描述文件
      - name: Checkout Info
        uses: actions/checkout@v4
        with:
          repository: 7aGiven/Phigros_Resource
          ref: info
          path: info_source

      - name: Setup Info
        run: |
          mkdir -p resource/info
          cp -rn info_source/* resource/info/ 2>/dev/null || true

      # 4. 设置 Python 与依赖
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Deps
        run: |
          sudo apt-get install -y libogg-dev libvorbis-dev
          pip install UnityPy fsb5

      # 5. 【核心步骤】分进程提取（彻底解决卡死）
      - name: Process Isolated Extraction
        working-directory: ./resource
        run: |
          # 定义一个重置配置的函数
          reset_config() {
            sed -i -E "s/^(avatar|Chart|illustration|illustrationBlur|illustrationLowRes|music)[[:space:]]*=.*/\1 = False/I" config.ini
          }

          # 批次 1: 头像与谱面 (轻量)
          echo "🚀 运行批次: Avatar & Chart"
          reset_config
          sed -i -E "s/^avatar[[:space:]]*=.*/avatar = True/I" config.ini
          sed -i -E "s/^Chart[[:space:]]*=.*/Chart = True/I" config.ini
          python resource.py Phigros.apk || echo "Avatar/Chart 部分提取失败"

          # 批次 2: 音乐 (中等)
          echo "🚀 运行批次: Music"
          reset_config
          sed -i -E "s/^music[[:space:]]*=.*/music = True/I" config.ini
          timeout 600 python resource.py Phigros.apk || echo "音乐提取超时，尝试保留已生成文件"

          # 批次 3: 插图原画 (重量 - 最易卡死)
          echo "🚀 运行批次: Illustration"
          reset_config
          sed -i -E "s/^illustration[[:space:]]*=.*/illustration = True/I" config.ini
          # 这里给插图设置 15 分钟超时，如果卡死会强行终止进程并进入下一步同步
          timeout 900 python resource.py Phigros.apk || echo "⚠️ 插图提取因内存或时间问题中断"

      # 6. 发布产物
      - name: Checkout Build Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: Sync & Push
        working-directory: ./resource
        run: |
          # 仅同步确实生成了内容的文件夹
          for folder in avatar chart illustration music; do
            if [ -d "$folder" ] && [ "$(ls -A $folder)" ]; then
              mkdir -p ../build_repo/$folder
              rsync -av --delete "$folder/" "../build_repo/$folder/"
            fi
          done
          cd ../build_repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto Update (Isolated Mode)" || exit 0
          git push origin master
