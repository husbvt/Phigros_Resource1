name: Update Zephyr Phigros Pages

on:
  workflow_run:
    workflows: ["Phigros Full Resources Final"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 检出资源库
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 2. 生成 Zephyr 专属下载网页
        run: |
          # 定义资源的基础 URL
          CDN_URL="https://cdn.jsdelivr.net/gh/husbvt/Phigros_Resource_Build@master"
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          
          # 1. 写入 HTML 头部和样式
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Zephyr的Phigros下载站</title>
              <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
              <style>
                  :root { --blue: #58a6ff; --bg: #0d1117; --card: #161b22; }
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: #c9d1d9; margin: 0; padding: 10px; }
                  .container { max-width: 900px; margin: auto; padding: 10px; }
                  h1 { color: var(--blue); text-align: center; margin: 30px 0; font-size: 2em; letter-spacing: 1px; }
                  .search-box { width: 100%; padding: 15px; background: var(--card); border: 1px solid #30363d; color: #fff; border-radius: 12px; margin-bottom: 25px; box-sizing: border-box; font-size: 1rem; }
                  
                  .song-card { background: var(--card); border: 1px solid #30363d; border-radius: 16px; margin-bottom: 30px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
                  .song-header { background: #21262d; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
                  .song-title { font-weight: bold; color: var(--blue); font-size: 1.2em; }
                  
                  .song-content { display: flex; flex-direction: column; padding: 20px; gap: 20px; }
                  @media (min-width: 650px) { .song-content { flex-direction: row; } }
                  
                  .preview-area { flex: 0 0 280px; }
                  .preview-img { width: 100%; border-radius: 10px; border: 1px solid #30363d; cursor: pointer; display: block; background: #000; transition: opacity 0.5s; opacity: 0; }
                  .preview-img.loaded { opacity: 1; }
                  
                  .resource-list { flex: 1; display: flex; flex-direction: column; gap: 8px; }
                  .file-item { display: flex; align-items: center; background: #0d1117; padding: 12px; border-radius: 8px; border: 1px solid #30363d; font-size: 0.9em; }
                  .checkbox { margin-right: 15px; width: 20px; height: 20px; cursor: pointer; }
                  
                  .tag { font-size: 0.75em; padding: 2px 8px; border-radius: 4px; color: #fff; margin-right: 10px; font-weight: bold; min-width: 50px; text-align: center; }
                  .tag-audio { background: #1f6feb; }
                  .tag-chart { background: #238636; }
                  
                  .btn-zip { background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.9em; }
                  .btn-zip:hover { background: #2ea043; }
                  .btn-zip:disabled { background: #30363d; cursor: not-allowed; }
                  .status { font-size: 0.8em; color: #8b949e; margin-right: 10px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Zephyr的Phigros下载站</h1>
                  <input type="text" id="search" class="search-box" placeholder="搜索歌曲、ID或文件名...">
                  <div id="list">
          EOF

          # 2. 遍历资源库并生成卡片内容
          cd build_repo
          # 汇总 ID (从三个文件夹里提取)
          ALL_IDS=$(ls music chart illustration 2>/dev/null | sed 's/\.[^.]*$//' | sort -u)

          for id in $ALL_IDS; do
              [ -z "$id" ] && continue
              
              # 匹配该 ID 下的所有文件 (使用 find 深度搜索)
              MUSIC_FILES=$(find music -name "${id}*" -type f)
              CHART_FILES=$(find chart -name "${id}*" -type f)
              ILLUS_FILE=$(find illustration -name "${id}*" -type f | head -n 1)

              # 开始生成卡片
              echo "<div class='song-card' data-name='$id'>" >> ../index.html
              echo "<div class='song-header'><span class='song-title'>$id</span>" >> ../index.html
              echo "<div><span id='st-$id' class='status'></span><button class='btn-zip' onclick='packAndDownload(\"$id\")'>打包下载已选项目</button></div></div>" >> ../index.html
              
              echo "<div class='song-content'>" >> ../index.html
              
              # 曲绘部分 (CDN 加速)
              echo "<div class='preview-area'>" >> ../index.html
              if [ ! -z "$ILLUS_FILE" ]; then
                  echo "<img class='preview-img lazy' data-src='$CDN_URL/$ILLUS_FILE' onclick='window.open(this.src)'>" >> ../index.html
              else
                  echo "<div style='height:150px; background:#30363d; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#8b949e;'>无预览图</div>" >> ../index.html
              fi
              echo "</div>" >> ../index.html
              
              # 资源列表部分 (重要修复：确保写入到 ../index.html 而不是错误的路径)
              echo "<div class='resource-list' id='files-$id'>" >> ../index.html
              
              # 写入音乐
              for f in $MUSIC_FILES; do
                  echo "<label class='file-item'><input type='checkbox' class='checkbox' data-url='$BASE_URL/$f' checked><span class='tag tag-audio'>Audio</span>$(basename "$f")</label>" >> ../../index.html
              done
              
              # 写入谱面 (修复：现在会循环显示所有找到的谱面)
              for f in $CHART_FILES; do
                  echo "<label class='file-item'><input type='checkbox' class='checkbox' data-url='$BASE_URL/$f' checked><span class='tag tag-chart'>Chart</span>$(basename "$f")</label>" >> ../../index.html
              done
              
              echo "</div></div></div>" >> ../index.html
          done
          cd ..

          # 3. 写入 JS 逻辑
          cat >> index.html <<EOF
                  </div>
              </div>
              <script>
                  // 1. 懒加载逻辑
                  const observer = new IntersectionObserver(entries => {
                      entries.forEach(entry => {
                          if (entry.isIntersecting) {
                              const img = entry.target;
                              img.src = img.dataset.src;
                              img.onload = () => img.classList.add('loaded');
                              observer.unobserve(img);
                          }
                      });
                  }, { rootMargin: '300px' });
                  document.querySelectorAll('.lazy').forEach(img => observer.observe(img));

                  // 2. 搜索逻辑
                  document.getElementById('search').addEventListener('input', function(e) {
                      const val = e.target.value.toLowerCase();
                      document.querySelectorAll('.song-card').forEach(card => {
                          card.style.display = card.getAttribute('data-name').toLowerCase().includes(val) ? "" : "none";
                      });
                  });

                  // 3. 核心打包下载逻辑
                  async function packAndDownload(id) {
                      const btn = event.target;
                      const status = document.getElementById('st-' + id);
                      const checkboxes = document.querySelectorAll('#files-' + id + ' .checkbox:checked');
                      
                      if (checkboxes.length === 0) {
                          alert('请至少勾选一个文件进行下载');
                          return;
                      }

                      btn.disabled = true;
                      const zip = new JSZip();
                      const folder = zip.folder(id);

                      try {
                          for (const cb of checkboxes) {
                              const fileUrl = cb.dataset.url;
                              const fileName = fileUrl.split('/').pop();
                              status.innerText = "正在获取: " + fileName;
                              
                              const response = await fetch(fileUrl);
                              if (!response.ok) throw new Error("文件获取失败");
                              const blob = await response.blob();
                              folder.file(fileName, blob);
                          }

                          status.innerText = "正在打包中...";
                          const zipBlob = await zip.generateAsync({ type: "blob" });
                          
                          const link = document.createElement('a');
                          link.href = URL.createObjectURL(zipBlob);
                          link.download = id + "_Zephyr_Pack.zip";
                          link.click();
                          
                          status.innerText = "下载已开始";
                      } catch (err) {
                          alert("打包失败: " + err.message);
                          status.innerText = "打包出错";
                      } finally {
                          setTimeout(() => {
                              btn.disabled = false;
                              status.innerText = "";
                          }, 3000);
                      }
                  }
              </script>
          </body>
          </html>
          EOF

      - name: 3. 部署到 Pages 仓库
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git clone "https://${AUTH_TOKEN}@github.com/husbvt/phigros.github.io.git" pages_repo
          cp index.html pages_repo/
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Zephyr Phigros Download Station - Local ZIP Pack" || echo "No changes"
          git push origin master --force
