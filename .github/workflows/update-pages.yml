name: Update Zephyr Phigros Pages

on:
  workflow_run:
    workflows: ["Phigros Full Resources Final"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: 1. 检出资源库
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 2. 生成 Zephyr 下载站 (带选择功能)
        run: |
          CDN_URL="https://cdn.jsdelivr.net/gh/husbvt/Phigros_Resource_Build@master"
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Zephyr的Phigros下载站</title>
              <style>
                  body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
                  .container { max-width: 1100px; margin: auto; }
                  h1 { color: #58a6ff; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
                  .search-box { width: 100%; padding: 12px; margin: 20px 0; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 8px; }
                  
                  .song-card { background: #161b22; border: 1px solid #30363d; margin-bottom: 30px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
                  .song-header { background: #21262d; padding: 15px; font-weight: bold; border-bottom: 1px solid #30363d; color: #58a6ff; font-size: 1.2em; display: flex; justify-content: space-between; align-items: center; }
                  
                  .song-content { display: flex; padding: 20px; gap: 25px; flex-wrap: wrap; }
                  .preview-area { flex: 0 0 300px; min-width: 300px; }
                  .preview-img { width: 100%; border-radius: 8px; border: 1px solid #30363d; cursor: pointer; background: #0d1117; }
                  
                  .resource-list { flex: 1; min-width: 350px; }
                  .file-row { display: flex; align-items: center; background: #0d1117; padding: 10px 15px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #30363d; transition: 0.2s; }
                  .file-row:hover { border-color: #58a6ff; }
                  .file-info { flex: 1; display: flex; align-items: center; font-size: 0.95em; }
                  
                  .tag { font-size: 0.75em; padding: 2px 8px; border-radius: 4px; color: white; margin-right: 12px; font-weight: bold; min-width: 50px; text-align: center; }
                  .tag-audio { background: #1f6feb; }
                  .tag-chart { background: #238636; }
                  
                  .checkbox-custom { width: 18px; height: 18px; margin-right: 15px; cursor: pointer; }
                  
                  .controls { display: flex; gap: 10px; }
                  .btn { border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
                  .btn-download { background: #238636; color: white; }
                  .btn-download:hover { background: #2ea043; }
                  .btn-select { background: #30363d; color: #c9d1d9; font-size: 0.8em; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Zephyr的Phigros下载站</h1>
                  <input type="text" id="search" class="search-box" placeholder="搜索歌曲 ID 或文件名..." onkeyup="filter()">
                  <div id="list">
          EOF

          cd build_repo
          ALL_IDS=$(ls music chart illustration 2>/dev/null | sed 's/\.[^.]*$//' | sort -u)
          
          for song_id in $ALL_IDS; do
              [ -z "$song_id" ] && continue
              
              echo "<div class='song-card' data-name='$song_id'>" >> ../index.html
              echo "<div class='song-header'><span>$song_id</span>" >> ../index.html
              echo "<div class='controls'><button class='btn btn-select' onclick='toggleSelect(\"$song_id\")'>全选/反选</button>" >> ../index.html
              echo "<button class='btn btn-download' onclick='downloadSelected(\"$song_id\")'>下载已选项目</button></div></div>" >> ../index.html
              
              echo "<div class='song-content'>" >> ../index.html
              
              # 图片预览
              ILLUS=$(find illustration -name "${song_id}*" -type f | head -n 1)
              echo "<div class='preview-area'>" >> ../index.html
              if [ ! -z "$ILLUS" ]; then
                  echo "<img class='preview-img lazy' data-src='$CDN_URL/$ILLUS' onclick='window.open(this.src)'>" >> ../index.html
              else
                  echo "<div style='height:160px; background:#30363d; border-radius:8px;'></div>" >> ../index.html
              fi
              echo "</div>" >> ../index.html
              
              # 资源列表 (带复选框)
              echo "<div class='resource-list' id='group-$song_id'>" >> ../index.html
              
              # 匹配音乐
              find music -name "${song_id}*" -type f | while read -r f; do
                  echo "<label class='file-row'><input type='checkbox' class='checkbox-custom' data-url='$BASE_URL/$f' checked><div class='file-info'><span class='tag tag-audio'>Audio</span>$(basename "$f")</div></label>" >> ../../index.html
              done
              
              # 匹配所有谱面
              find chart -name "${song_id}*" -type f | while read -r f; do
                  echo "<label class='file-row'><input type='checkbox' class='checkbox-custom' data-url='$BASE_URL/$f' checked><div class='file-info'><span class='tag tag-chart'>Chart</span>$(basename "$f")</div></label>" >> ../../index.html
              done
              
              echo "</div></div></div>" >> ../index.html
          done
          cd ..

          cat >> index.html <<EOF
                  </div>
              </div>
              <script>
                  // 1. 懒加载
                  const obs = new IntersectionObserver(es => es.forEach(e => {
                      if(e.isIntersecting) { e.target.src = e.target.dataset.src; obs.unobserve(e.target); }
                  }), {rootMargin:'200px'});
                  document.querySelectorAll('.lazy').forEach(i => obs.observe(i));

                  // 2. 全选/反选逻辑
                  function toggleSelect(id) {
                      const cbs = document.querySelectorAll('#group-' + id + ' input');
                      const allChecked = Array.from(cbs).every(c => c.checked);
                      cbs.forEach(c => c.checked = !allChecked);
                  }

                  // 3. 核心下载逻辑 (解决 Edge 拦截问题)
                  async function downloadSelected(id) {
                      const selected = document.querySelectorAll('#group-' + id + ' input:checked');
                      if(selected.length === 0) return alert('请先勾选要下载的项目');
                      
                      if(selected.length > 1) {
                          alert('提示：Edge可能会提示“允许下载多个文件”，请务必点击【允许】。');
                      }

                      for (let i = 0; i < selected.length; i++) {
                          const url = selected[i].dataset.url;
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = url.split('/').pop();
                          document.body.appendChild(a);
                          a.click();
                          document.body.removeChild(a);
                          // 间隔加长到 800ms，避开浏览器的并发拦截
                          await new Promise(r => setTimeout(r, 800));
                      }
                  }

                  function filter() {
                      let q = document.getElementById('search').value.toLowerCase();
                      document.querySelectorAll('.song-card').forEach(c => {
                          c.style.display = c.getAttribute('data-name').toLowerCase().includes(q) ? "" : "none";
                      });
                  }
              </script>
          </body>
          </html>
          EOF

      - name: 3. 部署
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git clone "https://${AUTH_TOKEN}@github.com/husbvt/phigros.github.io.git" pages_repo
          cp index.html pages_repo/
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update: Categorized resources with selection download" || echo "No changes"
          git push origin master --force
