name: Update Phigros Categorized Pages

on:
  workflow_run:
    workflows: ["Phigros Full Resources Final"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: 1. 检出资源库
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 2. 生成分类索引网页
        run: |
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          
          # 写入 HTML 头部
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Phigros 资源下载站</title>
              <style>
                  body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
                  .container { max-width: 1000px; margin: auto; }
                  h1 { color: #58a6ff; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
                  input#search { width: 100%; padding: 12px; margin: 20px 0; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 8px; box-sizing: border-box; border: 1px solid #30363d; }
                  .song-card { background: #161b22; border: 1px solid #30363d; margin-bottom: 25px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
                  .song-header { background: #21262d; padding: 15px; font-weight: bold; border-bottom: 1px solid #30363d; color: #58a6ff; font-size: 1.2em; word-break: break-all; }
                  .song-content { display: flex; padding: 15px; gap: 20px; flex-wrap: wrap; }
                  .preview-area { flex: 0 0 250px; min-width: 250px; }
                  .preview-img { width: 100%; border-radius: 8px; border: 1px solid #30363d; cursor: pointer; transition: transform 0.2s; }
                  .preview-img:hover { transform: scale(1.02); }
                  .resource-list { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 300px; }
                  .file-item { display: flex; justify-content: space-between; align-items: center; background: #0d1117; padding: 10px 15px; border-radius: 6px; border: 1px solid #30363d; }
                  .tag { font-size: 0.7em; padding: 2px 8px; border-radius: 4px; color: white; margin-right: 10px; font-weight: bold; text-transform: uppercase; }
                  .tag-music { background: #1f6feb; }
                  .tag-chart { background: #238636; }
                  .btn { color: #58a6ff; text-decoration: none; font-weight: bold; border: 1px solid #30363d; padding: 6px 16px; border-radius: 4px; font-size: 0.9em; background: #21262d; transition: 0.2s; }
                  .btn:hover { background: #30363d; border-color: #8b949e; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Phigros 资源库 (聚合分类版)</h1>
                  <input type="text" id="search" placeholder="输入歌曲关键词搜索..." onkeyup="filter()">
                  <div id="list">
          EOF

          # 核心逻辑
          cd build_repo
          
          # 汇总所有可能的歌曲 ID（从音乐和谱面文件夹同时获取，确保不遗漏）
          ALL_IDS=$(ls music chart 2>/dev/null | sed 's/\.[^.]*$//' | sort -u)
          
          for song_id in $ALL_IDS; do
              [ -z "$song_id" ] && continue

              # 将内容暂存，最后统一写入根目录的 index.html
              echo "<div class='song-card' data-name='$song_id'>" >> ../index.html
              echo "<div class='song-header'>$song_id</div>" >> ../index.html
              echo "<div class='song-content'>" >> ../index.html
              
              # 1. 曲绘
              ILLUS=$(find illustration -name "${song_id}*" -type f | head -n 1)
              echo "<div class='preview-area'>" >> ../index.html
              if [ ! -z "$ILLUS" ]; then
                  echo "<img class='preview-img' src='$BASE_URL/$ILLUS' onclick='window.open(this.src)'>" >> ../index.html
              else
                  echo "<div style='width:100%;height:140px;background:#30363d;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8b949e'>无曲绘预览</div>" >> ../index.html
              fi
              echo "</div>" >> ../index.html
              
              # 2. 资源列表
              echo "<div class='resource-list'>" >> ../index.html
              
              # 音乐匹配 (修正写入路径为 ../index.html)
              find music -name "${song_id}*" -type f | while read -r f; do
                  echo "<div class='file-item'><span><span class='tag tag-music'>Music</span>$(basename "$f")</span><a class='btn' href='$BASE_URL/$f' target='_blank'>下载</a></div>" >> ../index.html
              done
              
              # 谱面匹配 (修正写入路径为 ../index.html)
              find chart -name "${song_id}*" -type f | while read -r f; do
                  echo "<div class='file-item'><span><span class='tag tag-chart'>Chart</span>$(basename "$f")</span><a class='btn' href='$BASE_URL/$f' target='_blank'>下载</a></div>" >> ../index.html
              done
              
              echo "</div></div></div>" >> ../index.html
          done
          cd ..

          # 写入尾部
          cat >> index.html <<EOF
                  </div>
              </div>
              <script>
                  function filter() {
                      let q = document.getElementById('search').value.toLowerCase();
                      document.querySelectorAll('.song-card').forEach(c => {
                          c.style.display = c.getAttribute('data-name').toLowerCase().includes(q) ? "" : "none";
                      });
                  }
              </script>
          </body>
          </html>
          EOF

      - name: 3. 部署到网页仓库
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git clone "https://${AUTH_TOKEN}@github.com/husbvt/phigros.github.io.git" pages_repo
          cp index.html pages_repo/
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix: Add missing resource buttons" || echo "No changes"
          git push origin master --force
