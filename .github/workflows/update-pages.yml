name: Update Phigros Categorized Pages

on:
  workflow_run:
    workflows: ["Phigros Full Resources Final"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: 1. 检出资源库
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 2. 生成一键下载版网页
        run: |
          CDN_URL="https://cdn.jsdelivr.net/gh/husbvt/Phigros_Resource_Build@master"
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Phigros 资源下载站</title>
              <style>
                  body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
                  .container { max-width: 1000px; margin: auto; }
                  h1 { color: #58a6ff; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
                  input#search { width: 100%; padding: 12px; margin: 20px 0; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 8px; box-sizing: border-box; border: 1px solid #30363d; }
                  .song-card { background: #161b22; border: 1px solid #30363d; margin-bottom: 25px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
                  .song-header { background: #21262d; padding: 15px; font-weight: bold; border-bottom: 1px solid #30363d; color: #58a6ff; font-size: 1.2em; display: flex; justify-content: space-between; align-items: center; }
                  .song-content { display: flex; padding: 15px; gap: 20px; flex-wrap: wrap; }
                  .preview-area { flex: 0 0 250px; min-width: 250px; }
                  .preview-img { width: 100%; border-radius: 8px; border: 1px solid #30363d; cursor: pointer; }
                  .resource-list { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 300px; }
                  .file-item { display: flex; justify-content: space-between; align-items: center; background: #0d1117; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; font-size: 0.9em; }
                  .tag { font-size: 0.7em; padding: 2px 6px; border-radius: 4px; color: white; margin-right: 8px; font-weight: bold; }
                  .tag-music { background: #1f6feb; }
                  .tag-chart { background: #238636; }
                  .btn-all { background: #238636; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
                  .btn-all:hover { background: #2ea043; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Phigros 资源库 (一键下载版)</h1>
                  <input type="text" id="search" placeholder="搜索歌曲 ID..." onkeyup="filter()">
                  <div id="list">
          EOF

          cd build_repo
          # 汇总所有 ID
          ALL_IDS=$(ls music chart illustration 2>/dev/null | sed 's/\.[^.]*$//' | sort -u)
          
          for song_id in $ALL_IDS; do
              [ -z "$song_id" ] && continue

              # 获取该歌曲所有关联文件
              MUSIC_FILES=$(find music -name "${song_id}*" -type f)
              CHART_FILES=$(find chart -name "${song_id}*" -type f)
              ILLUS_FILE=$(find illustration -name "${song_id}*" -type f | head -n 1)

              # 构建一键下载的链接数组 (JS 格式)
              DL_ARRAY=""
              for f in $MUSIC_FILES $CHART_FILES $ILLUS_FILE; do
                  DL_ARRAY+="'$BASE_URL/$f',"
              done

              echo "<div class='song-card' data-name='$song_id'>" >> ../index.html
              echo "<div class='song-header'><span>$song_id</span><button class='btn-all' onclick=\"downloadAll([$DL_ARRAY])\">一键打包下载</button></div>" >> ../index.html
              echo "<div class='song-content'>" >> ../index.html
              
              # 曲绘预览
              echo "<div class='preview-area'>" >> ../index.html
              if [ ! -z "$ILLUS_FILE" ]; then
                  echo "<img class='preview-img' src='$CDN_URL/$ILLUS_FILE' loading='lazy' onclick='window.open(this.src)'>" >> ../index.html
              else
                  echo "<div style='width:100%;height:140px;background:#30363d;border-radius:8px;'></div>" >> ../index.html
              fi
              echo "</div>" >> ../index.html
              
              # 列表
              echo "<div class='resource-list'>" >> ../index.html
              for f in $MUSIC_FILES; do
                  echo "<div class='file-item'><span><span class='tag tag-music'>Music</span>$(basename "$f")</span></div>" >> ../../index.html
              done
              for f in $CHART_FILES; do
                  echo "<div class='file-item'><span><span class='tag tag-chart'>Chart</span>$(basename "$f")</span></div>" >> ../../index.html
              done
              echo "</div></div></div>" >> ../index.html
          done
          cd ..

          cat >> index.html <<EOF
                  </div>
              </div>
              <script>
                  async function downloadAll(urls) {
                      for (const url of urls) {
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = url.split('/').pop();
                          document.body.appendChild(a);
                          a.click();
                          document.body.removeChild(a);
                          // 稍微延迟，防止浏览器拦截多个下载
                          await new Promise(r => setTimeout(r, 500));
                      }
                  }
                  function filter() {
                      let q = document.getElementById('search').value.toLowerCase();
                      document.querySelectorAll('.song-card').forEach(c => {
                          c.style.display = c.getAttribute('data-name').toLowerCase().includes(q) ? "" : "none";
                      });
                  }
              </script>
          </body>
          </html>
          EOF

      - name: 3. 部署
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git clone "https://${AUTH_TOKEN}@github.com/husbvt/phigros.github.io.git" pages_repo
          cp index.html pages_repo/
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: Add one-click download for all resources" || echo "No changes"
          git push origin master --force
