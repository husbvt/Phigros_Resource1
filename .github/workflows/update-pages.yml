name: Update Zephyr Phigros Pages

on:
  workflow_run:
    workflows: ["Phigros Full Resources Final"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: 1. 检出资源库
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 2. 生成 Zephyr 下载站 (本地自动打包版)
        run: |
          CDN_URL="https://cdn.jsdelivr.net/gh/husbvt/Phigros_Resource_Build@master"
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Zephyr的Phigros下载站</title>
              <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
              <style>
                  body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
                  .container { max-width: 1000px; margin: auto; }
                  h1 { color: #58a6ff; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
                  .search-box { width: 100%; padding: 12px; margin: 20px 0; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 8px; }
                  
                  .song-card { background: #161b22; border: 1px solid #30363d; margin-bottom: 30px; border-radius: 12px; overflow: hidden; }
                  .song-header { background: #21262d; padding: 15px; font-weight: bold; border-bottom: 1px solid #30363d; color: #58a6ff; display: flex; justify-content: space-between; align-items: center; }
                  
                  .song-content { display: flex; padding: 20px; gap: 20px; flex-wrap: wrap; }
                  .preview-area { flex: 0 0 260px; }
                  .preview-img { width: 100%; border-radius: 8px; border: 1px solid #30363d; cursor: pointer; }
                  
                  .resource-list { flex: 1; min-width: 300px; }
                  .file-row { display: flex; align-items: center; background: #0d1117; padding: 8px 12px; margin-bottom: 5px; border-radius: 6px; border: 1px solid #30363d; font-size: 0.9em; }
                  .tag { font-size: 0.7em; padding: 2px 6px; border-radius: 4px; color: white; margin-right: 10px; font-weight: bold; }
                  .tag-audio { background: #1f6feb; }
                  .tag-chart { background: #238636; }
                  
                  .btn-zip { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
                  .btn-zip:disabled { background: #30363d; cursor: not-allowed; }
                  .status-text { font-size: 0.8em; color: #8b949e; margin-right: 10px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Zephyr的Phigros下载站</h1>
                  <input type="text" id="search" class="search-box" placeholder="搜索歌曲..." onkeyup="filter()">
                  <div id="list">
          EOF

          cd build_repo
          # 扫描所有文件夹汇总 ID
          ALL_IDS=$(ls music chart illustration 2>/dev/null | sed 's/\.[^.]*$//' | sort -u)
          
          for song_id in $ALL_IDS; do
              [ -z "$song_id" ] && continue
              
              # 关键修复：递归搜索该 ID 对应的所有文件
              MUSIC_FILES=$(find music -name "${song_id}*" -type f)
              CHART_FILES=$(find chart -name "${song_id}*" -type f)
              ILLUS_FILE=$(find illustration -name "${song_id}*" -type f | head -n 1)

              echo "<div class='song-card' data-name='$song_id'>" >> ../index.html
              echo "<div class='song-header'><span>$song_id</span>" >> ../index.html
              echo "<div><span id='status-$song_id' class='status-text'></span>" >> ../index.html
              echo "<button class='btn-zip' id='btn-$song_id' onclick='zipAndDownload(\"$song_id\")'>打包下载全部</button></div></div>" >> ../index.html
              
              echo "<div class='song-content'>" >> ../index.html
              
              # 曲绘预览
              echo "<div class='preview-area'>" >> ../index.html
              if [ ! -z "$ILLUS_FILE" ]; then
                  echo "<img class='preview-img lazy' data-src='$CDN_URL/$ILLUS_FILE' onclick='window.open(this.src)'>" >> ../index.html
              else
                  echo "<div style='height:150px; background:#333; border-radius:8px;'></div>" >> ../index.html
              fi
              echo "</div>" >> ../index.html
              
              # 资源列表清单 (包含所有谱面)
              echo "<div class='resource-list' id='files-$song_id'>" >> ../index.html
              for f in $MUSIC_FILES; do
                  echo "<div class='file-row' data-url='$BASE_URL/$f'><span class='tag tag-audio'>Audio</span>$(basename "$f")</div>" >> ../index.html
              done
              for f in $CHART_FILES; do
                  # 谱面会在这里循环显示
                  echo "<div class='file-row' data-url='$BASE_URL/$f'><span class='tag tag-chart'>Chart</span>$(basename "$f")</div>" >> ../index.html
              done
              echo "</div></div></div>" >> ../index.html
          done
          cd ..

          cat >> index.html <<EOF
                  </div>
              </div>
              <script>
                  // 懒加载
                  const obs = new IntersectionObserver(es => es.forEach(e => {
                      if(e.isIntersecting) { e.target.src = e.target.dataset.src; obs.unobserve(e.target); }
                  }), {rootMargin:'200px'});
                  document.querySelectorAll('.lazy').forEach(i => obs.observe(i));

                  // 核心打包逻辑
                  async function zipAndDownload(id) {
                      const btn = document.getElementById('btn-' + id);
                      const status = document.getElementById('status-' + id);
                      const fileRows = document.querySelectorAll('#files-' + id + ' .file-row');
                      
                      btn.disabled = true;
                      status.innerText = "正在准备打包...";
                      
                      const zip = new JSZip();
                      const folder = zip.folder(id);

                      try {
                          for (let row of fileRows) {
                              const url = row.dataset.url;
                              const fileName = url.split('/').pop();
                              status.innerText = "正在下载: " + fileName;
                              
                              const response = await fetch(url);
                              if (!response.ok) throw new Error("下载失败");
                              const blob = await response.blob();
                              folder.file(fileName, blob);
                          }

                          status.innerText = "正在生成 ZIP...";
                          const content = await zip.generateAsync({type: "blob"});
                          
                          const link = document.createElement('a');
                          link.href = URL.createObjectURL(content);
                          link.download = id + "_resources.zip";
                          link.click();
                          
                          status.innerText = "完成！";
                      } catch (err) {
                          alert("打包失败: " + err.message);
                          status.innerText = "出错";
                      } finally {
                          btn.disabled = false;
                      }
                  }

                  function filter() {
                      let q = document.getElementById('search').value.toLowerCase();
                      document.querySelectorAll('.song-card').forEach(c => {
                          c.style.display = c.getAttribute('data-name').toLowerCase().includes(q) ? "" : "none";
                      });
                  }
              </script>
          </body>
          </html>
          EOF

      - name: 3. 部署
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git clone "https://${AUTH_TOKEN}@github.com/husbvt/phigros.github.io.git" pages_repo
          cp index.html pages_repo/
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: Add local ZIP packaging for all song resources" || echo "No changes"
          git push origin master --force
