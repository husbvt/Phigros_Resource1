name: Update Phigros Categorized Pages

on:
  workflow_run:
    workflows: ["Phigros Full Resources Final"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: 1. 检出资源库
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 2. 生成分类索引网页
        run: |
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          
          # 网页头部
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Phigros 资源下载站</title>
              <style>
                  body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
                  .container { max-width: 900px; margin: auto; }
                  h1 { color: #58a6ff; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
                  input#search { width: 100%; padding: 12px; margin: 20px 0; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 8px; box-sizing: border-box; }
                  
                  /* 歌曲卡片样式 */
                  .song-card { background: #161b22; border: 1px solid #30363d; margin-bottom: 20px; border-radius: 8px; overflow: hidden; }
                  .song-header { background: #21262d; padding: 12px 15px; font-weight: bold; border-bottom: 1px solid #30363d; color: #58a6ff; font-size: 1.1em; }
                  .song-body { padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
                  
                  .resource-group { display: flex; flex-direction: column; gap: 8px; }
                  .resource-item { display: flex; justify-content: space-between; align-items: center; background: #0d1117; padding: 8px 12px; border-radius: 4px; border: 1px solid #30363d; font-size: 0.9em; }
                  .tag { font-size: 0.7em; background: #238636; color: white; padding: 2px 6px; border-radius: 4px; margin-right: 8px; text-transform: uppercase; }
                  .btn { color: #58a6ff; text-decoration: none; font-weight: bold; }
                  .btn:hover { text-decoration: underline; }
                  
                  .preview-img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 4px; border: 1px solid #30363d; cursor: pointer; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Phigros 资源库 (歌曲聚合)</h1>
                  <input type="text" id="search" placeholder="输入歌曲 ID 或关键词搜索..." onkeyup="filter()">
                  <div id="list">
          EOF

          # 核心逻辑：按歌曲名（文件名核心部分）分类
          # 我们先获取所有歌曲的唯一 ID (基于 music 文件夹)
          cd build_repo
          ls music | sed 's/\.[^.]*$//' | sort -u | while read -r song_id; do
              if [ -z "$song_id" ]; then continue; fi
              
              echo "<div class='song-card' data-name='$song_id'>" >> ../index.html
              echo "<div class='song-header'>$song_id</div>" >> ../index.html
              echo "<div class='song-body'>" >> ../index.html
              
              # 1. 查找对应的曲绘预览
              ILLUS=$(find illustration -name "${song_id}*" -type f | head -n 1)
              if [ ! -z "$ILLUS" ]; then
                  echo "<div class='resource-group'><img class='preview-img' src='$BASE_URL/$ILLUS' onclick='window.open(this.src)'></div>" >> ../index.html
              fi
              
              echo "<div class='resource-group'>" >> ../index.html
              
              # 2. 查找音乐文件
              find music -name "${song_id}*" -type f | while read -r f; do
                  echo "<div class='resource-item'><span><span class='tag'>Music</span>$(basename "$f")</span><a class='btn' href='$BASE_URL/$f' target='_blank'>下载</a></div>" >> ../../index.html
              done
              
              # 3. 查找所有难度的谱面
              find chart -name "${song_id}*" -type f | while read -r f; do
                  echo "<div class='resource-item'><span><span class='tag'>Chart</span>$(basename "$f")</span><a class='btn' href='$BASE_URL/$f' target='_blank'>下载</a></div>" >> ../../index.html
              done
              
              echo "</div></div></div>" >> ../index.html
          done
          cd ..

          # 网页尾部
          cat >> index.html <<EOF
                  </div>
              </div>
              <script>
                  function filter() {
                      let q = document.getElementById('search').value.toLowerCase();
                      document.querySelectorAll('.song-card').forEach(c => {
                          c.style.
