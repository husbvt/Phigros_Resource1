name: Update Zephyr Phigros Pages

on:
  workflow_run:
    workflows: ["Phigros Full Resources Final"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 检出资源库
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 2. 生成网页 (修正重定向错误)
        run: |
          CDN_URL="https://cdn.jsdelivr.net/gh/husbvt/Phigros_Resource_Build@master"
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          
          # 先写前半部分 HTML
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Zephyr的下载站</title>
              <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
              <style>
                  :root { --blue: #58a6ff; --bg: #0d1117; --card: #161b22; }
                  body { font-family: -apple-system, sans-serif; background: var(--bg); color: #c9d1d9; margin: 0; padding: 15px; }
                  .container { max-width: 900px; margin: auto; }
                  h1 { color: var(--blue); text-align: center; margin-bottom: 30px; }
                  .search-box { width: 100%; padding: 12px; background: var(--card); border: 1px solid #30363d; color: #fff; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
                  .song-card { background: var(--card); border: 1px solid #30363d; border-radius: 12px; margin-bottom: 25px; overflow: hidden; }
                  .song-header { background: #21262d; padding: 15px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
                  .song-content { display: flex; flex-direction: column; padding: 15px; gap: 20px; }
                  @media (min-width: 600px) { .song-content { flex-direction: row; } }
                  .preview-area { flex: 0 0 250px; }
                  .preview-img { width: 100%; border-radius: 8px; border: 1px solid #30363d; background: #000; opacity: 0; transition: 0.3s; }
                  .resource-list { flex: 1; }
                  .file-item { display: flex; align-items: center; background: #0d1117; padding: 8px 12px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #30363d; font-size: 0.9em; }
                  .checkbox { margin-right: 12px; transform: scale(1.2); cursor: pointer; }
                  .tag { font-size: 0.7em; padding: 2px 6px; border-radius: 4px; color: #fff; margin-right: 8px; font-weight: bold; min-width: 45px; text-align: center; }
                  .tag-audio { background: #1f6feb; }
                  .tag-chart { background: #238636; }
                  .btn-zip { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
                  .btn-zip:disabled { background: #333; }
                  .status { font-size: 0.8em; color: #8b949e; margin-right: 10px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Zephyr的下载站</h1>
                  <input type="text" id="search" class="search-box" placeholder="输入 ID 搜索...">
                  <div id="list">
          EOF

          # 在 build_repo 里扫描并写入中间资源
          cd build_repo
          # 提取所有唯一 ID
          SONG_IDS=$(ls music chart illustration 2>/dev/null | sed 's/\.[^.]*$//' | sort -u)

          for id in $SONG_IDS; do
              [ -z "$id" ] && continue
              ILL=$(find illustration -name "${id}*" -type f | head -n 1)
              
              # 构建资源卡片
              echo "<div class='song-card' data-name='$id'>" >> ../index.html
              echo "<div class='song-header'><span style='font-weight:bold;color:#58a6ff;'>$id</span>" >> ../index.html
              echo "<div><span id='st-$id' class='status'></span><button class='btn-zip' onclick='pack(\"$id\")'>打包下载</button></div></div>" >> ../index.html
              echo "<div class='song-content'><div class='preview-area'>" >> ../index.html
              
              if [ ! -z "$ILL" ]; then
                  echo "<img class='preview-img lazy' data-src='$CDN_URL/$ILL' onclick='window.open(this.src)'>" >> ../index.html
              fi
              echo "</div><div class='resource-list' id='files-$id'>" >> ../index.html
              
              # 匹配音频和谱面 (核心修复：确保文件确实存在才生成 HTML)
              find music -name "${id}*" -type f | while read -r f; do
                  echo "<label class='file-item'><input type='checkbox' class='checkbox' data-url='$BASE_URL/$f' checked><span class='tag tag-audio'>Audio</span>$(basename "$f")</label>" >> ../../index.html
              done
              find chart -name "${id}*" -type f | while read -r f; do
                  echo "<label class='file-item'><input type='checkbox' class='checkbox' data-url='$BASE_URL/$f' checked><span class='tag tag-chart'>Chart</span>$(basename "$f")</label>" >> ../../index.html
              done
              echo "</div></div></div>" >> ../index.html
          done
          cd ..

          # 写入后半部分脚本逻辑
          cat >> index.html <<'EOF'
                  </div>
              </div>
              <script>
                  const PROXIES = [
                      'https://api.allorigins.win/raw?url=',
                      'https://cors-anywhere.azm.workers.dev/',
                      '' 
                  ];

                  const obs = new IntersectionObserver(es => es.forEach(e => {
                      if(e.isIntersecting) { e.target.src = e.target.dataset.src; e.target.style.opacity=1; obs.unobserve(e.target); }
                  }), {rootMargin:'300px'});
                  document.querySelectorAll('.lazy').forEach(i => obs.observe(i));

                  async function pack(id) {
                      const btn = event.target;
                      const st = document.getElementById('st-' + id);
                      const items = document.querySelectorAll('#files-' + id + ' .checkbox:checked');
                      if(items.length === 0) return alert('未选择文件');
                      
                      btn.disabled = true;
                      const zip = new JSZip();
                      try {
                          for(let item of items) {
                              const url = item.dataset.url;
                              const name = url.split('/').pop();
                              st.innerText = "获取: " + name;
                              
                              let blob = null;
                              for(let proxy of PROXIES) {
                                  try {
                                      const res = await fetch(proxy + encodeURIComponent(url));
                                      if(res.ok) { blob = await res.blob(); break; }
                                  } catch(e) {}
                              }
                              if(!blob) throw new Error("获取失败");
                              zip.file(name, blob);
                          }
                          st.innerText = "压缩中...";
                          const content = await zip.generateAsync({type:"blob"});
                          const a = document.createElement('a');
                          a.href = URL.createObjectURL(content);
                          a.download = id + ".zip";
                          a.click();
                          st.innerText = "完成";
                      } catch(e) { alert(e.message); st.innerText = "出错"; }
                      btn.disabled = false;
                  }

                  document.getElementById('search').oninput = function() {
                      let v = this.value.toLowerCase();
                      document.querySelectorAll('.song-card').forEach(c => {
                          c.style.display = c.getAttribute('data-name').toLowerCase().includes(v) ? "" : "none";
                      });
                  };
              </script>
          </body>
          </html>
          EOF

      - name: 3. 部署
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git clone "https://${AUTH_TOKEN}@github.com/husbvt/phigros.github.io.git" pages_repo
          cp index.html pages_repo/
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Zephyr: CORS 打包修复版 $(date)" || echo ""
          git push origin master --force
