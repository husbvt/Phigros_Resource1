name: Update Zephyr Phigros Pages

on:
  workflow_run:
    workflows: ["Phigros Full Resources Final"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 检出资源库
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 2. 生成 Zephyr 专属下载站
        run: |
          # 设置基础配置
          BASE_URL="https://husbvt.github.io/Phigros_Resource_Build"
          
          # 1. 生成 HTML 头部和样式
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Zephyr的Phigros下载站</title>
              <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
              <style>
                  :root { --blue: #58a6ff; --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; }
                  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; line-height: 1.5; }
                  .container { max-width: 1000px; margin: auto; }
                  h1 { color: var(--blue); text-align: center; margin-bottom: 25px; }
                  .search-box { width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--border); color: #fff; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; transition: border-color 0.2s; }
                  .search-box:focus { outline: none; border-color: var(--blue); }
                  
                  .song-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
                  .song-header { background: #21262d; padding: 12px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
                  .song-header span { font-weight: bold; color: var(--blue); }
                  
                  .song-content { display: grid; grid-template-columns: 200px 1fr; gap: 15px; padding: 15px; }
                  @media (max-width: 650px) { .song-content { grid-template-columns: 1fr; } }
                  
                  .preview-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: #000; cursor: zoom-in; }
                  .file-item { display: flex; align-items: center; background: #0d1117; padding: 8px 12px; margin-bottom: 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; cursor: pointer; }
                  .file-item:hover { border-color: var(--blue); }
                  .checkbox { margin-right: 10px; }
                  
                  .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; color: #fff; margin-right: 8px; font-weight: bold; }
                  .tag-audio { background: #1f6feb; }
                  .tag-chart { background: #238636; }
                  .tag-ill { background: #da3633; }
                  
                  .btn-zip { background: #238636; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
                  .btn-zip:disabled { background: #30363d; opacity: 0.7; }
                  
                  .difficulty { font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-left: auto; }
                  .difficulty-ez { background: #238636; }
                  .difficulty-hd { background: #1f6feb; }
                  .difficulty-in { background: #8957e5; }
                  .difficulty-at { background: #f0883e; }
                  .difficulty-sp { background: #9e6a03; }
                  
                  /* 进度条样式 */
                  .progress-container { width: 100%; background: #21262d; height: 4px; border-radius: 2px; margin-top: 8px; display: none; }
                  .progress-bar { width: 0%; height: 100%; background: var(--blue); transition: width 0.2s; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🎵 Zephyr的Phigros资源站</h1>
                  <input type="text" id="search" class="search-box" placeholder="输入歌曲名或ID搜索...">
                  <div id="list">
          EOF

          cd build_repo
          # 2. 改进的逻辑：遍历 chart 文件夹获取所有歌曲目录
          find chart -maxdepth 1 -mindepth 1 -type d | sort | while read -r dir; do
              id=$(basename "$dir")
              
              # 查找关联文件
              # 匹配规则：精确匹配 ID 或 ID.扩展名
              ILL_FILES=$(find illustration -type f -name "${id}.*" 2>/dev/null)
              AUDIO_FILES=$(find music -type f \( -name "${id}.*" -o -name "${id}-*.mp3" \) 2>/dev/null)
              CHART_FILES=$(find "chart/${id}" -type f -name "*.json" 2>/dev/null)
              
              # 跳过完全没文件的（虽然不太可能）
              [ -z "$ILL_FILES" ] && [ -z "$AUDIO_FILES" ] && [ -z "$CHART_FILES" ] && continue
              
              ILL_PREVIEW=$(echo "$ILL_FILES" | head -n1)
              
              # 生成卡片 HTML
              echo "<div class='song-card' data-name='$id'>" >> ../index.html
              echo "<div class='song-header'><span>$id</span>" >> ../index.html
              echo "<button class='btn-zip' onclick='pack(\"$id\", this)'>📦 打包下载</button></div>" >> ../index.html
              echo "<div class='song-content'><div class='preview-area'>" >> ../index.html
              
              if [ -n "$ILL_PREVIEW" ]; then
                  echo "<img class='preview-img lazy' data-src='${BASE_URL}/${ILL_PREVIEW}' onclick='window.open(this.dataset.src)'>" >> ../index.html
              else
                  echo "<div style='height:112px; background:#333; border-radius:6px; display:flex; align-items:center; justify-content:center;'>No Cover</div>" >> ../index.html
              fi
              echo "<div class='progress-container' id='pg-box-$id'><div class='progress-bar' id='pg-$id'></div></div>" >> ../index.html
              echo "</div><div class='resource-list' id='files-$id'>" >> ../index.html
              
              # 渲染文件列表函数
              render_file() {
                  local f="$1"
                  local type="$2"
                  local tag_class="$3"
                  local name=$(basename "$f")
                  local url="${BASE_URL}/${f}"
                  # 处理 URL 中的特殊字符
                  url=$(echo "$url" | sed 's/ /%20/g; s/\[/%5B/g; s/\]/%5D/g')
                  
                  local diff_tag=""
                  if [[ "$type" == "谱面" ]]; then
                      case "${name^^}" in
                          *EZ*) diff_tag="<span class='difficulty difficulty-ez'>EZ</span>" ;;
                          *HD*) diff_tag="<span class='difficulty difficulty-hd'>HD</span>" ;;
                          *IN*) diff_tag="<span class='difficulty difficulty-in'>IN</span>" ;;
                          *AT*) diff_tag="<span class='difficulty difficulty-at'>AT</span>" ;;
                          *SP*) diff_tag="<span class='difficulty difficulty-sp'>SP</span>" ;;
                      esac
                  fi
                  
                  echo "<label class='file-item'><input type='checkbox' class='checkbox' data-url='$url' data-name='$name' checked><span class='tag $tag_class'>$type</span>$name $diff_tag</label>" >> ../index.html
              }

              for f in $ILL_FILES; do render_file "$f" "曲绘" "tag-ill"; done
              for f in $AUDIO_FILES; do render_file "$f" "音频" "tag-audio"; done
              for f in $CHART_FILES; do render_file "$f" "谱面" "tag-chart"; done
              
              echo "</div></div></div>" >> ../index.html
          done
          cd ..

          # 3. 注入 JavaScript 逻辑
          cat >> index.html <<EOF
                  </div>
              </div>
              <script>
                  // 1. 搜索过滤
                  document.getElementById('search').addEventListener('input', (e) => {
                      const term = e.target.value.toLowerCase();
                      document.querySelectorAll('.song-card').forEach(card => {
                          card.style.display = card.dataset.name.toLowerCase().includes(term) ? '' : 'none';
                      });
                  });

                  // 2. 懒加载图片
                  const observer = new IntersectionObserver(entries => {
                      entries.forEach(entry => {
                          if(entry.isIntersecting) {
                              const img = entry.target;
                              img.src = img.dataset.src;
                              observer.unobserve(img);
                          }
                      });
                  });
                  document.querySelectorAll('.preview-img.lazy').forEach(img => observer.observe(img));

                  // 3. 打包下载逻辑
                  async function pack(id, btn) {
                      const container = document.getElementById('files-' + id);
                      const checks = container.querySelectorAll('.checkbox:checked');
                      if(checks.length === 0) return alert('请选择文件');

                      btn.disabled = true;
                      const pgBox = document.getElementById('pg-box-' + id);
                      const pgBar = document.getElementById('pg-' + id);
                      pgBox.style.display = 'block';
                      
                      const zip = new JSZip();
                      let loaded = 0;

                      try {
                          for(let cb of checks) {
                              // 使用 CORS 代理
                              const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(cb.dataset.url);
                              const res = await fetch(proxyUrl);
                              if(!res.ok) throw new Error('网络请求失败');
                              const blob = await res.blob();
                              zip.file(cb.dataset.name, blob);
                              
                              loaded++;
                              pgBar.style.width = (loaded / checks.length * 100) + '%';
                          }

                          const content = await zip.generateAsync({type: 'blob'});
                          const link = document.createElement('a');
                          link.href = URL.createObjectURL(content);
                          link.download = \`Phigros_\${id}.zip\`;
                          link.click();
                          btn.innerText = '✅ 下载成功';
                      } catch(e) {
                          alert('下载失败: ' + e.message);
                          btn.innerText = '❌ 失败';
                      } finally {
                          setTimeout(() => {
                              btn.disabled = false;
                              btn.innerText = '📦 打包下载';
                              pgBox.style.display = 'none';
                              pgBar.style.width = '0%';
                          }, 3000);
                      }
                  }
              </script>
          </body>
          </html>
          EOF

      - name: 3. 部署到 GitHub Pages
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          git clone "https://${AUTH_TOKEN}@github.com/husbvt/phigros.github.io.git" pages_repo
          cp index.html pages_repo/
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --quiet HEAD; then
            git commit -m "Auto Update: $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin master
          fi
