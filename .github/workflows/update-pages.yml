name: Update Zephyr Phigros Pages

on:
  workflow_run:
    workflows: ["Phigros Full Resources Final"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 检出资源库
        uses: actions/checkout@v4
        with:
          repository: husbvt/Phigros_Resource_Build
          token: ${{ secrets.BUILD_PAT }}
          path: build_repo

      - name: 2. 生成下载站HTML
        run: |
          # 给脚本执行权限
          chmod +x ./scripts/generate_zephyr_site.sh
          
          # 运行生成脚本
          ./scripts/generate_zephyr_site.sh build_repo home.html
          
          echo "HTML文件生成完成，大小: $(wc -l < home.html) 行"

      - name: 3. 部署到GitHub Pages
        env:
          AUTH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          echo "正在部署到GitHub Pages..."
          
          # 克隆Pages仓库
          git clone "https://${AUTH_TOKEN}@github.com/husbvt/phigros.github.io.git" pages_repo
          
          # 复制home.html
          cp home.html pages_repo/
          
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有变化
          if ! git diff --quiet home.html; then
              echo "检测到home.html有变化，正在提交..."
              git add home.html
              git commit -m "Zephyr: 更新下载站并添加强制访问控制 $(date '+%Y-%m-%d %H:%M:%S')"
              git push origin master
              echo "✅ 部署成功！"
              
              echo ""
              echo "==============================="
              echo "部署完成！"
              echo "==============================="
              echo "验证页地址: https://husbvt.github.io/phigros.github.io/index.html"
              echo "下载站地址: https://husbvt.github.io/phigros.github.io/home.html"
              echo "==============================="
          else
              echo "没有检测到变化，跳过提交。"
          fi
          
          # 清理
          cd ..
          rm -rf pages_repo build_repo home.html
          echo "部署流程完成。"
